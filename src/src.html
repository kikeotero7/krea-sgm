<title>SGM Presupuestos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14261a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
<style>
/* Layout: cuaderno de obra — barra lateral blanca con el logo, área de trabajo verdosa, total siempre visible como un ticket */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#f7f9f5; --ink:#192028; --muted:#5b675e; --faint:#8a958c;
  --line:#dfe6dc; --line-strong:#c9d4c5;
  --brand:#14741a; --brand-strong:#0d5a12; --brand-ink:#ffffff; --brand-soft:#e5f1e2; --brand-text:#14741a; --forest:#14261a; --forest-ink:#eef4ec;
  --side:#14261a; --side-ink:#eef4ec; --side-muted:#a9b8ab; --side-hover:#1d3524; --side-line:#26412e;
  --warn:#9a5b00; --warn-soft:#fbefd9; --danger:#b3261e; --danger-soft:#fbe4e1; --info:#245a86; --info-soft:#e2edf7;
  --ok:#14741a; --ok-soft:#e5f1e2;
  --plate:#ffffff; --veil:rgba(250,252,249,.94); --veil-soft:rgba(250,252,249,.55);
  --shadow:0 1px 2px rgba(20,38,26,.06),0 8px 24px rgba(20,38,26,.06);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#161d18; --surface-2:#1b241d; --ink:#e6ede4; --muted:#a3b0a5; --faint:#7d897f;
  --line:#28332a; --line-strong:#36443a;
  --brand:#4fae55; --brand-strong:#6cc472; --brand-ink:#0b1a0d; --brand-soft:#1c2e1f; --brand-text:#6cc472; --forest:#0b170e; --forest-ink:#e6efe4;
  --side:#0f1d13; --side-ink:#e6efe4; --side-muted:#a3b0a5; --side-hover:#17281b; --side-line:#203325;
  --warn:#e2a54b; --warn-soft:#2e2414; --danger:#ef8077; --danger-soft:#33191a; --info:#7db3e0; --info-soft:#14222f;
  --ok:#6cc472; --ok-soft:#1c2e1f; --plate:#f4f7f2; --veil:rgba(14,19,16,.92); --veil-soft:rgba(14,19,16,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#161d18; --surface-2:#1b241d; --ink:#e6ede4; --muted:#a3b0a5; --faint:#7d897f;
  --line:#28332a; --line-strong:#36443a;
  --brand:#4fae55; --brand-strong:#6cc472; --brand-ink:#0b1a0d; --brand-soft:#1c2e1f; --brand-text:#6cc472; --forest:#0b170e; --forest-ink:#e6efe4;
  --side:#0f1d13; --side-ink:#e6efe4; --side-muted:#a3b0a5; --side-hover:#17281b; --side-line:#203325;
  --warn:#e2a54b; --warn-soft:#2e2414; --danger:#ef8077; --danger-soft:#33191a; --info:#7db3e0; --info-soft:#14222f;
  --ok:#6cc472; --ok-soft:#1c2e1f; --plate:#f4f7f2; --veil:rgba(14,19,16,.92); --veil-soft:rgba(14,19,16,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:108%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,.money{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);padding:22px 16px 18px}
.side-logo{border-radius:var(--r);padding:12px 14px;display:block;background:#fff}
.side-logo img{display:block;width:100%;height:auto}
.side-sub{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);text-align:center;margin-top:-6px}
.btn-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r);background:var(--brand);color:var(--brand-ink);padding:13px 14px;font-weight:700;font-size:15px}
.btn-new:hover{background:var(--brand-strong)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:10px 12px;text-align:left;color:var(--side-muted);font-weight:600}
.nav button:hover{background:var(--side-hover);color:var(--side-ink)}
.nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink)}
.nav .count{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--side-muted)}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink);font-family:var(--f-display);font-weight:700}
.user b{display:block;color:var(--side-ink);font-size:14px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:inherit}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.sync[data-st="saving"]::before{background:var(--warn)}.sync[data-st="offline"]::before,.sync[data-st="error"]::before{background:var(--danger)}
.demo-tag{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:4px 8px;font-weight:600;line-height:1.35}

.topbar{display:none}
.main{min-width:0;padding-block:28px 120px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.tabbar{display:none}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-text)}
.head h1{font-size:clamp(26px,3vw,34px);font-weight:800;margin-top:4px}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Basics ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-text)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line-strong))}
.btn.danger.solid,.btn.danger.solid:hover{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:18px;font-weight:700}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.input{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px;font-weight:500;color:var(--ink)}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Borrador{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-Enviado{background:var(--info-soft);color:var(--info)}
.st-Aceptado,.st-Cobrada,.st-Terminada{background:var(--ok-soft);color:var(--ok)}
.st-Rechazado,.st-Vencida{background:var(--danger-soft);color:var(--danger)}
.st-Pendiente,.st-En\ curso{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.chip .n{opacity:.7;margin-left:4px}
.chk-mp{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:var(--muted)}.chk-mp input{width:20px;height:20px;accent-color:var(--brand)}
.pay-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.pay-op{min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:22px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--ink)}
.pay-op[aria-checked="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.pay-op[data-v="Sin especificar"][aria-checked="false"]{border-style:dashed;color:var(--muted)}
.btn.guardando{pointer-events:none;color:#fff;border-color:var(--brand);background:linear-gradient(var(--brand),var(--brand)) left/100% 100% no-repeat,var(--brand-soft);animation:rellenar .55s ease-out}
@media (prefers-reduced-motion:reduce){.btn.guardando{animation:none}}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--faint)}
.search input{padding-left:40px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- Dashboard ---------- */
.hero{position:relative;overflow:hidden;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:center;min-height:300px}
.hero>*:not(.kv){position:relative;z-index:1}
.hero h1{font-size:clamp(26px,2.5vw,34px);font-weight:800;line-height:1.08;margin:8px 0 10px}
.hero p{margin:0;color:var(--muted);max-width:42ch}
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);border-radius:12px;padding:14px;min-height:84px;transition:border-color .15s,transform .15s,box-shadow .15s}
.tpl:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
.tpl b{font-family:var(--f-display);font-size:16px;font-stretch:108%}
.tpl span{font-size:12px;color:var(--muted)}
.tpl.blank{border-style:dashed}
/* Imagen de portada (6 propuestas) */
.kv{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--surface)}
.kv-img{position:absolute;inset:0;background-size:cover;background-position:center}
.kv-veil{position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--surface) 86%,transparent) 0%,color-mix(in srgb,var(--surface) 72%,transparent) 34%,color-mix(in srgb,var(--surface) 22%,transparent) 60%,transparent 100%)}
.kv-oficio .kv-img{background-position:70% 40%}
.kv-arquitectura .kv-img{background-position:center 55%}
.kv-plano .kv-img{background-position:center 30%;filter:grayscale(1) contrast(1.05) brightness(1.06)}
.kv-plano .kv-veil{background:linear-gradient(90deg,var(--veil) 0%,var(--veil) 38%,color-mix(in srgb,var(--brand) 22%,transparent) 100%)}
.kv-interior .kv-img{background-position:center 60%}
.kv-emblema{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--brand) 16%,var(--surface)) 0%,var(--surface) 60%)}
.kv-emblema .kv-stripes{position:absolute;right:-6%;top:-20%;bottom:-20%;width:58%;background:repeating-linear-gradient(135deg,transparent 0 34px,color-mix(in srgb,var(--brand) 9%,transparent) 34px 64px)}
.kv-emblema .kv-mark{position:absolute;right:4%;bottom:-6%;width:46%;max-width:520px;opacity:.12}
.kv-dibujo{background-color:var(--surface-2);background-image:linear-gradient(color-mix(in srgb,var(--brand) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--brand) 9%,transparent) 1px,transparent 1px);background-size:24px 24px}
.kv-draw{position:absolute;right:2%;bottom:0;height:96%;width:auto;max-width:62%;color:var(--brand);opacity:.55}
.kv-draw text{fill:currentColor;stroke:none;font:600 13px var(--f-display)}
.kv-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kv-pick b{font-weight:700;color:var(--ink);margin-right:4px}
.kv-pick button{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.kv-pick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* Acceso */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);background:var(--surface)}
.login-visual{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;min-height:320px}
.login-visual .kv-veil{background:linear-gradient(0deg,var(--veil) 0%,var(--veil) 24%,var(--veil-soft) 46%,transparent 72%)}
.login-visual .kv-plano .kv-veil{background:linear-gradient(0deg,var(--veil) 0%,color-mix(in srgb,var(--brand) 18%,transparent) 70%)}
.login-cap{position:relative;z-index:1;display:grid;gap:6px;max-width:460px}
.login-cap h2{font-size:clamp(28px,3.3vw,44px);font-weight:800;line-height:1.05;color:var(--ink);text-shadow:0 1px 18px var(--veil),0 0 2px var(--veil)}
.login-cap .eyebrow{color:var(--brand-strong);font-size:13px;text-shadow:0 0 10px var(--veil)}
.login-cap p{margin:0;color:var(--ink);font-weight:600;font-size:16px;text-shadow:0 0 10px var(--veil)}
.login-panel{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:380px;margin:0 auto;display:grid;gap:16px}
.login-box .lg{background:var(--plate);border-radius:14px;padding:10px;width:180px;justify-self:center}
.login-box .lg img{display:block;width:100%;height:auto}
.login-box h1{font-size:28px;font-weight:800;text-align:center}
.login-box .sub{text-align:center;color:var(--muted);margin:-8px 0 4px}
.login-box .btn{min-height:50px;font-size:16px}
.login-foot{max-width:380px;margin:0 auto;width:100%;display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;text-align:left}
button.kpi:hover{border-color:var(--line-strong)}
.kpi .k-label{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:var(--f-display);font-size:26px;font-weight:800;font-stretch:104%;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-sub{font-size:12px;color:var(--faint)}
.kpi.warn .k-val{color:var(--warn)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.todo{display:grid}
.todo-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo-item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%}
.dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)} .dot.info{background:var(--info)} .dot.muted{background:var(--faint)}
.todo-item b{display:block;font-weight:600}
.todo-item span{font-size:13px;color:var(--muted)}

/* ---------- Lists ---------- */
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto auto;gap:16px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:110px}
.li .date{font-size:13px;color:var(--muted);white-space:nowrap}
.cols .li{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}.cols .li .date,.cols .li .act{display:none}.cols .li .c2{grid-column:1;grid-row:2}.cols .li .pill{grid-column:2;grid-row:2;justify-self:end}.cols .li .amt{grid-column:2;grid-row:1;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;text-align:left;color:inherit;align-content:start}
button.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:700}
.card .meta{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.card .stats{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.card .stats b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-spent{background:var(--warn)} .bar .b-margin{background:var(--brand)}

/* ---------- Editor ---------- */
.steps{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.step{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left;min-width:0}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);font-family:var(--f-display);font-weight:700;font-size:14px}
.step[aria-current="step"]{background:var(--brand-soft);color:var(--brand-strong)}
.step[aria-current="step"] .n{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.done .n{border-color:var(--brand);color:var(--brand)}
.step small{display:block;font-weight:500;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step span{min-width:0}
.client-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cp{display:grid;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px}
.cp:hover{border-color:var(--brand)}
.cp b{font-weight:600}
.cp span{font-size:12px;color:var(--muted)}
.chosen{display:flex;align-items:center;gap:14px;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:12px;padding:14px 16px}
.chosen .avatar{background:var(--brand);color:var(--brand-ink);flex:none}
.chosen b{display:block;font-size:16px}
.chosen span{font-size:13px;color:var(--muted)}
.ed-grid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:22px;align-items:start}
.picker{position:sticky;top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 140px);overflow:hidden}
.picker-head{padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.picker-close{display:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.picker-body{overflow-y:auto;padding:4px 14px 14px}
.cat-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.cat-item:first-child{border-top:0}
.cat-item b{display:block;font-weight:600;font-size:14px}
.cat-item span{font-size:12px;color:var(--muted)}
.add{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--brand);background:var(--surface);color:var(--brand);display:grid;place-items:center}
.add:hover{background:var(--brand-soft)}
.add.on{background:var(--brand);color:var(--brand-ink)}
.cap-label{font-family:var(--f-display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin:14px 0 2px}
.dict textarea{min-height:150px}
.chat{display:flex;flex-direction:column;gap:12px;padding-top:12px;min-height:100%}
.msgs{display:grid;gap:8px;align-content:start}
.msg{max-width:92%;padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{justify-self:end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:4px}
.msg.assistant{justify-self:start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.note{justify-self:start;font-size:12px;font-weight:600;color:var(--brand-strong);background:var(--brand-soft);border-radius:8px;padding:5px 10px}
.msg.think{color:var(--muted);font-style:italic}
.ai-ex{display:grid;gap:6px}
.ai-ex button{text-align:left;border:1px dashed var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--muted)}
.ai-ex button:hover{border-color:var(--brand);color:var(--ink)}
.compose{position:sticky;bottom:-14px;margin-top:auto;background:var(--surface);padding-block:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;border-top:1px solid var(--line)}
.compose textarea{width:100%;min-height:70px;max-height:180px;resize:vertical;border:1px solid var(--line-strong);border-radius:12px;padding:10px 12px;font-size:15px;background:var(--surface);line-height:1.45}
.compose textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.compose .col{display:grid;gap:6px}
.ai-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--brand-strong);background:var(--brand-soft);border-radius:20px;padding:3px 10px}
.ai-start{display:flex;gap:8px;margin-top:18px;max-width:520px}
.ai-start .input{background:var(--surface)}
.ai-start-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--brand-strong);margin-top:16px}
.found{display:grid;gap:6px;margin-top:12px}
.found label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.found input{width:20px;height:20px;accent-color:var(--brand)}
.found small{display:block;color:var(--muted);font-size:12px}
.lines{display:grid;gap:14px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chap-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.chap-head .ci{font-family:var(--f-display);font-weight:800;color:var(--brand);font-variant-numeric:tabular-nums}
.chap-head h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.chap-head .money{margin-left:auto;font-family:var(--f-display);font-weight:700}
.line{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.chap-head+.line{border-top:0}
.line-top{display:flex;gap:10px;align-items:center}
.line-top .lno{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;min-width:28px}
.line-name{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;margin:-6px -8px;font-weight:600;font-size:15px}
.line-name:hover{border-color:var(--line)}
.line-name:focus{border-color:var(--brand);outline:none;background:var(--surface)}
.line-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-left:38px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:40px;height:42px;border:0;background:var(--surface-2);font-size:20px;line-height:1;color:var(--ink)}
.stepper button:hover{background:var(--brand-soft);color:var(--brand-strong)}
.stepper input{width:70px;height:42px;border:0;text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;background:transparent}
.unit{height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 8px;font-weight:600}
.price{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px}
.price input{width:96px;height:44px;border:1px solid var(--line-strong);border-radius:10px;text-align:right;padding:0 10px;font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;background:var(--surface)}
.line .amt{margin-left:auto;font-family:var(--f-display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.line details{padding-left:38px}
.line summary{cursor:pointer;font-size:13px;color:var(--brand);font-weight:600;list-style:none;display:inline-flex;gap:6px;align-items:center}
.line summary::-webkit-details-marker{display:none}
.line .more{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px;align-items:end}
.line .more .chk-mp{grid-column:1/-1;order:5}.line .more [data-act=delLine]{order:6;justify-self:start}.line .more label.field:has([data-k=note]){grid-column:1/-1}
.hint{font-size:12px;color:var(--faint)}
.open-sheet{display:none}
.scrim{display:none}
.ed-bar{position:fixed;left:256px;right:0;bottom:0;z-index:30;background:var(--forest);color:var(--forest-ink);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.ed-bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px}
.ed-bar .tot{display:grid;line-height:1.15}
.ed-bar .tot span{font-size:12px;opacity:.7}
.ed-bar .tot b{font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;font-stretch:104%}
.ed-bar .btn{border-color:rgba(255,255,255,.25);background:transparent;color:inherit}
.ed-bar .btn:hover{border-color:rgba(255,255,255,.6);color:inherit}
.ed-bar .btn.go{background:#fff;color:#14261a;border-color:#fff}
.ed-bar .btn.go:hover{background:#e5f1e2;color:#14261a}
.review{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:22px;align-items:start}
.status-seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.status-seg button{border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.status-seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}

/* ---------- Documento (papel A4, siempre claro) ---------- */
.paper-wrap{background:#dfe4dc;border-radius:var(--r);padding:18px;overflow:hidden}
.paper{--p-ink:#24382b;--p-muted:#607463;--p-line:#dce6da;--p-green:#237320;--p-forest:#21482c;--p-soft:#edf4eb;--p-soft2:#f4f7f2;
  width:794px;min-height:1123px;margin:0 auto;background:#fff;color:var(--p-ink);padding:50px 50px 36px;box-shadow:0 2px 6px rgba(0,0,0,.08),0 20px 50px rgba(0,0,0,.12);font:12px/1.5 var(--f-body);display:flex;flex-direction:column;gap:22px;color-scheme:light;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:30px;padding-bottom:20px;border-bottom:3px solid var(--p-green)}
.p-head img{width:140px;height:auto;display:block}
.p-id{text-align:right;display:grid;gap:4px;justify-items:end}
.p-kind{font-family:var(--f-display);font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--p-green);font-size:12px}
.p-no{font-family:var(--f-display);font-weight:800;font-size:26px;font-stretch:104%;letter-spacing:-.01em;color:#182b20}
.p-dates{display:grid;grid-template-columns:auto auto;gap:2px 14px;margin:6px 0 0;font-size:12px}
.p-dates dt{color:var(--p-muted)} .p-dates dd{margin:0;font-weight:600;text-align:right;color:#182b20}
.p-parties{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.p-parties>div{background:var(--p-soft);border:1px solid #dbe6d8;border-radius:8px;padding:16px 18px;min-width:0}
.p-parties h4{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#527047;margin-bottom:8px;font-stretch:100%}
.p-parties strong{display:block;font-size:14px;margin-bottom:3px;color:#182b20}
.p-parties p{margin:2px 0 0;color:#3d4842;overflow-wrap:anywhere}
.p-parties .nw{white-space:nowrap}
.p-work span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#61765b;font-weight:700}
.p-work h2{font-size:22px;color:#182b20;margin-top:6px;font-weight:800;line-height:1.25}
.p-work p{margin:4px 0 0;color:var(--p-muted)}
.p-table{width:100%;border-collapse:collapse;table-layout:fixed}
.p-table th{background:var(--p-forest);color:#fff;font-size:10.5px;letter-spacing:.04em;font-weight:600;padding:11px 9px;text-align:left}
.p-table th.r,.p-table td.r{text-align:right}
.p-table td{padding:11px 9px;vertical-align:top;border-bottom:1px solid var(--p-line);font-variant-numeric:tabular-nums;font-size:11.5px}
.p-table tr.z td{background:var(--p-soft)}
.p-table .chapr td{background:#dbe8d6;color:var(--p-forest);font-weight:800;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid var(--p-forest);padding-top:9px;padding-bottom:7px}
.p-table td b{display:block;font-weight:700;color:#203b28;font-size:12px}
.p-table td small{display:block;color:var(--p-muted);font-size:10.5px;margin-top:4px;line-height:1.5}
.p-table .no{color:var(--p-muted);font-size:10.5px}
.p-table .imp{font-weight:700;color:var(--p-forest)}
.p-bottom{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:26px;align-items:start}
.p-sum h4,.p-cond h4,.p-pay h4{font-size:11px;letter-spacing:.04em;color:var(--p-forest);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--p-line);font-stretch:100%}
.p-sum table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:11.5px}
.p-foot span:first-child{white-space:nowrap}.p-foot span:last-child{text-align:right}
.p-sum td{padding:4px 0;border-bottom:1px dotted var(--p-line)}
.p-sum td.r{text-align:right;font-weight:600}
.p-tot{border:1px solid var(--p-line);border-radius:8px;overflow:hidden}
.p-tot div{display:flex;justify-content:space-between;gap:12px;padding:8px 14px;background:var(--p-soft2);border-bottom:1px solid #e1e9dd;font-variant-numeric:tabular-nums}
.p-tot div b{font-weight:700;white-space:nowrap}
.p-tot .grand{background:var(--p-forest);color:#fff;border:0;padding:14px;align-items:baseline}
.p-tot .grand span{font-size:16px}
.p-tot .grand b{font-family:var(--f-display);font-size:22px;font-weight:800}
.p-cond p{margin:0;white-space:pre-line;color:#3d4842;font-size:11px;line-height:1.65}
.p-pay{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.p-pay>div{background:var(--p-soft2);border:1px solid var(--p-line);border-radius:8px;padding:12px 14px}
.p-pay h4{border:0;padding:0;margin-bottom:4px}
.p-pay p{margin:0;font-size:11px;color:#3d4842}
.p-iban{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--p-forest)}
.p-sign{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:4px}
.p-sign div{border-top:1px solid #9aa79c;padding-top:6px;font-size:10.5px;color:var(--p-muted);min-height:64px}
.p-foot{margin-top:auto;display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--p-line);padding-top:10px;font-size:9.5px;color:#7b877e}

/* Cabecera negra en todas las secciones */
.topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;align-items:center;gap:12px;background:var(--side);color:var(--side-ink);border-bottom:1px solid var(--side-line);padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-height:60px}
.topbar .tlogo{display:none}
.topbar .tb-title{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.tb-btn{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:42px;min-width:42px;justify-content:center;border:1px solid var(--side-line);background:transparent;color:var(--side-ink);border-radius:10px;padding:0 10px;font-weight:600}
.tb-btn:hover{background:var(--side-hover)}
.tb-out{border-color:#6cc472;color:#9bdba0}
.tb-badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:#d93025;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* Barra de carga verde arriba */
#carga{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:120;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent 0,var(--brand) 30%,#6cc472 50%,var(--brand) 70%,transparent 100%);background-size:200% 100%}
#carga.on{opacity:1;animation:carga 1s linear infinite}
@keyframes carga{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){#carga.on{animation:none}}
/* Iniciales del perfil */
.tb-avatar{width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:var(--brand-ink);font-family:var(--f-display);font-weight:800;font-size:15px;display:grid;place-items:center}
/* Recordatorios */
.rec{grid-template-columns:auto minmax(0,1fr) auto!important}
.rec-check{width:30px;height:30px;border-radius:8px;border:2px solid var(--line-strong);background:var(--surface);color:var(--brand-ink);display:grid;place-items:center;padding:0}
.rec-check[aria-pressed="true"]{background:var(--brand);border-color:var(--brand)}
.rec-check .ic{width:18px;height:18px}
.rec.done b{text-decoration:line-through;color:var(--muted)}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
/* Asistente de voz */
.voz-bar{display:grid;gap:6px;grid-column:1/-1}
.voz{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border:0;border-radius:14px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:17px}
.voz .ic{width:24px;height:24px}
.voz{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.voz.on{background:var(--side);color:#fff}
.voz-onda{width:14px;height:14px;border-radius:50%;background:#e5484d;box-shadow:0 0 0 0 rgba(229,72,77,.6);animation:onda 1.2s ease-out infinite}
@keyframes onda{to{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
@media (prefers-reduced-motion:reduce){.voz-onda{animation:none}}
.voz-ayuda{margin:0;text-align:center;font-size:13px;color:var(--muted)}
/* Micrófono para dictar */
.mic-btn{display:inline-grid;place-items:center;width:46px;height:46px;flex:none;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--brand-text)}
.mic-btn.on{background:#e5484d;border-color:#e5484d;color:#fff}
.mic-btn.in{position:absolute;right:0;top:0;height:100%;border:0;background:none;border-radius:0 10px 10px 0}
.mic-btn.in.on{background:#e5484d;color:#fff}
.con-mic{position:relative;display:block}
.con-mic input{padding-right:52px}
.ai-start{display:flex;gap:8px;align-items:center}
.gasto-ia{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.foto-ticket{min-height:58px;font-size:16px;cursor:pointer}
@media (max-width:640px){.gasto-ia{grid-template-columns:1fr}}
.voz-guia{background:#fff8d6;color:#5b4a00;border:1px solid #f0d66b;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:600;line-height:1.45}
.inv-num{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;padding:14px 16px;border-top:1px solid var(--line);background:var(--surface)}
@media (max-width:640px){.inv-num{grid-template-columns:1fr}.inv-num .btn{width:100%}}
/* Con IVA / Sin IVA */
.iva-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-weight:600;font-size:15px}
.iva-sw{display:inline-flex;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:3px;gap:3px}
.iva-sw button{min-height:40px;padding:0 16px;border:0;border-radius:9px;background:none;font:inherit;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.iva-sw button[aria-pressed="true"]{background:var(--side);color:#fff}
.ed-bar .tot{justify-items:start;grid-template-rows:auto}
.ed-bar .iva-sw.bar{height:34px;flex:none}
.ed-bar .iva-sw.bar button{height:28px;min-height:0;line-height:28px;white-space:nowrap;overflow:visible}
.ed-bar .tot{flex:none}
.iva-sw.bar{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);border-radius:9px;padding:2px;margin-bottom:4px}

const $=(s,r=document)=>r.querySelector(s);

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const r2=n=>Math.round((+n||0)*100)/100;
function group(i){return i.replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function eur(n){n=r2(n);const neg=n<0;const [i,d]=Math.abs(n).toFixed(2).split('.');return (neg?'−':'')+group(i)+','+d+' €'}
function eur0(n){n=Math.round(+n||0);return (n<0?'−':'')+group(String(Math.abs(n)))+' €'}
function qtyFmt(n){n=r2(n);if(Number.isInteger(n))return group(String(n));const [i,d]=n.toFixed(2).replace(/0$/,'').split('.');return group(i)+','+d}
function parseNum(v){v=String(v??'').trim();if(!v)return 0;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:0}
const MONTHS=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DAYS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const daysSince=s=>Math.floor((new Date(today()+'T12:00:00')-new Date(s+'T12:00:00'))/864e5);
function dLong(s){if(!s)return '';const d=new Date(s+'T12:00:00');return d.getDate()+' de '+MONTHS[d.getMonth()]+' de '+d.getFullYear()}
function dShort(s){if(!s)return '';const d=new Date(s+'T12:00:00');return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear()}
function ago(s){const n=daysSince(s);return n<=0?'hoy':n===1?'ayer':'hace '+n+' días'}
const initials=n=>String(n||'?').split(/\s+/).filter(w=>w.length>2||/^[A-ZÁÉÍÓÚ]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';

function calc(d){
  const caps=[],map={};
  for(const l of d.lines){const k=l.cap||'otr';if(!map[k]){map[k]={id:k,name:capName(k),lines:[],sub:0};caps.push(map[k])}map[k].lines.push(l);map[k].sub=r2(map[k].sub+r2(l.qty*l.price))}
  caps.sort((a,b)=>CAP_ORDER.indexOf(a.id)-CAP_ORDER.indexOf(b.id));
  const base=r2(caps.reduce((s,c)=>s+c.sub,0)),disc=r2(base*(+d.discount||0)/100),net=r2(base-disc),iva=r2(net*(+d.iva||0)/100);
  return {caps,base,disc,net,iva,total:r2(net+iva)};
}

const CLOUD={session:null,rev:0,dirty:false,busy:false,again:false,timer:null,state:'ok'};
function sbStore(x){CLOUD.session=x;try{x?localStorage.setItem('sgm2-session',JSON.stringify(x)):localStorage.removeItem('sgm2-session')}catch(e){}}
function sbLoad(){try{return JSON.parse(localStorage.getItem('sgm2-session'))}catch(e){return null}}
let CARGAS=0;
/* Guardar: el botón se rellena de verde con la barra de carga arriba y después se guarda */
const GUARDAR=new Set(['addExpense','createInvoice','saveClient','saveNewClient','saveWork','saveCustom','saveDatos','saveProfile','saveExpense','recSave','saveCo','changePass']);
function guardando(b,fn){const quieto=matchMedia('(prefers-reduced-motion: reduce)').matches;b.classList.add('guardando');b.setAttribute('aria-busy','true');cargando(1);
  setTimeout(()=>{cargando(-1);b.classList.remove('guardando');b.removeAttribute('aria-busy');fn()},quieto?0:550)}
function cargando(d){CARGAS=Math.max(0,CARGAS+d);let b=document.getElementById('carga');if(!b){b=document.createElement('div');b.id='carga';b.setAttribute('aria-hidden','true');document.body.append(b)}b.classList.toggle('on',CARGAS>0)}
async function api(accion,body,{signal}={}){
  cargando(1);try{
  const r=await fetch('api/index.php?accion='+accion,{method:'POST',credentials:'same-origin',signal,headers:{'Content-Type':'application/json','X-SGM':'1'},body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&CLOUD.session&&!['entrar','crear','nueva_clave'].includes(accion))sessionEnded();
  if(!r.ok||j.ok===false)throw Object.assign(new Error(j.error||(r.status>=500?'No se ha podido completar. Inténtalo de nuevo en un momento.':'Error '+r.status)),{status:r.status});
  return j}finally{cargando(-1)}}
function sessionEnded(){if(!CLOUD.session)return;sbStore(null);AUTH=false;CLOUD.rev=0;render();setTimeout(()=>toast('Vuelve a entrar con tu correo y contraseña'),300)}
const SYNC_TXT={ok:'Sincronizado',saving:'Guardando…',offline:'Sin conexión · se guardará al volver',error:'No se ha podido sincronizar'};
function setCloud(st){CLOUD.state=st;$$('.sync').forEach(el=>{el.dataset.st=st;el.textContent=SYNC_TXT[st]||''})}
function normData(x){x.contacts??=[];x.custom??=[];x.prices??={};x.reminders??=[];x.profile??={nombre:'Sergio',apellidos:'García Molina',dni:'',telefono:'',email:''};x.company.gestorName??='';x.company.invStart??='';x.company.invStartYear??='';x.company.quoteStart??='';x.company.quoteStartYear??='';x.company.gestorEmail??='';return x}
function mergeData(remote,local){const out={...remote,...local,company:{...remote.company,...local.company},profile:{...(remote.profile||{}),...(local.profile||{})},prices:{...(remote.prices||{}),...(local.prices||{})}};
  for(const k of ['clients','works','quotes','invoices','expenses','contacts','custom','reminders']){const key=k==='custom'?'name':'id';const m=new Map();for(const it of remote[k]||[])m.set(it[key],it);for(const it of local[k]||[])m.set(it[key],it);out[k]=[...m.values()]}
  return normData(out)}
function canRerender(){const a=document.activeElement;return !(a&&a.matches&&a.matches('input,textarea,select'))&&!$('#dlg')?.open}
function keepRev(r){CLOUD.rev=r;store('sgm2-rev',String(r))}
async function cloudPull(){
  if(DEMO||!CLOUD.session||CLOUD.busy||CLOUD.dirty)return;
  try{const j=await api('leer');
    if(!j.datos){await cloudPush(true);return}
    if(j.version!==CLOUD.rev&&j.datos.v===2){db=normData(j.datos);keepRev(j.version);saveLocal();if(S.view!=='editor'&&canRerender())render()}
    applyPendingDatos();setCloud('ok')}
  catch(e){if(CLOUD.session)setCloud(navigator.onLine?'error':'offline')}}
async function cloudPush(){
  if(DEMO||!CLOUD.session)return;if(CLOUD.busy){CLOUD.again=true;return}
  CLOUD.busy=true;CLOUD.dirty=false;
  try{const snap=JSON.parse(JSON.stringify(db));
    try{keepRev((await api('guardar',{datos:snap,version:CLOUD.rev})).version)}
    catch(e){if(e.status!==409)throw e;
      // Otro dispositivo guardó antes: se juntan los dos y se vuelve a guardar
      const r=await api('leer');db=mergeData(r.datos,snap);saveLocal();keepRev((await api('guardar',{datos:db,version:r.version})).version);if(S.view!=='editor'&&canRerender())render()}
    if(!CLOUD.dirty)store('sgm2-dirty','0');setCloud(CLOUD.dirty?'saving':'ok');applyPendingDatos()}
  catch(e){CLOUD.dirty=true;if(CLOUD.session)setCloud(navigator.onLine?'error':'offline')}
  finally{CLOUD.busy=false;if(CLOUD.again||(CLOUD.dirty&&CLOUD.state==='saving')){CLOUD.again=false;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,800)}}}
function applyPendingDatos(){let x=null;try{x=JSON.parse(sessionStorage.getItem('sgm2-datos'))}catch(e){}if(!x)return;try{sessionStorage.removeItem('sgm2-datos')}catch(e){}
  let n=0;for(const k in x){if(x[k]&&db.company[k]!==x[k]){db.company[k]=x[k];n++}}if(n){save();toast('Datos de la empresa guardados')}}
function cloudStart(){CLOUD.rev=+(store('sgm2-rev')||0);if(store('sgm2-dirty')==='1'){CLOUD.dirty=true;cloudPush()}else cloudPull()}
if(!DEMO){
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')CLOUD.dirty?cloudPush():cloudPull()});
  window.addEventListener('online',()=>{CLOUD.dirty?cloudPush():cloudPull()});
  window.addEventListener('offline',()=>{if(CLOUD.session)setCloud('offline')});
  setInterval(()=>{if(document.visibilityState==='visible')CLOUD.dirty?cloudPush():cloudPull()},45000);
}

async function passHash(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sgm2-app|'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

const EYE_OFF='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function pwField(id,label,ac){return `<div class="field acc-f"><label for="${id}">${label}</label><div class="con-ojo"><input id="${id}" type="password" autocomplete="${ac}" required><button type="button" class="ver-clave" data-ojo="${id}" aria-label="Mostrar la contraseña" aria-pressed="false">${EYE}</button></div></div>`}
function legalLinks(){return `<nav class="legal-links" aria-label="Información legal"><button type="button" data-legal="aviso">Aviso legal</button><button type="button" data-legal="privacidad">Privacidad</button><button type="button" data-legal="condiciones">Condiciones de uso</button><button type="button" data-legal="cookies">Cookies</button></nav>`}

function accShell(tit,sub,inner,foot=true){
  document.body.classList.remove('editing');
  $('#app').innerHTML=`<div class="acc" style="grid-column:1/-1">
   <header class="acc-head"><div class="acc-sello" role="img" aria-label="Construcciones SGM · Trabajos integrales"><img src="${LOGO_LOGIN}" alt=""></div>${tit===APP_NAME?'':`<h1>${tit}</h1>`}<p>${sub}</p></header>
   <main class="acc-body">${inner}${foot?legalLinks()+pieKrea():''}</main></div><div id="toast-slot"></div>`;
  wireAcc();
}
function wireAcc(){
  document.querySelectorAll('.ver-clave').forEach(b=>b.addEventListener('click',()=>{const i=$('#'+b.dataset.ojo),on=i.type==='password';i.type=on?'text':'password';b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Ocultar la contraseña':'Mostrar la contraseña');b.innerHTML=on?EYE_OFF:EYE}));
  document.querySelectorAll('[data-legal]').forEach(b=>b.addEventListener('click',()=>vLegal(b.dataset.legal)));
}

let LOGIN_MODE='in';
function vLoginCloud(){
  if(/[?&]recuperar=[a-f0-9]{64}/.test(location.search))return vRecovery();
  const isNew=LOGIN_MODE==='new';
  accShell(APP_NAME,APP_LEMA,`<form class="acc-form" id="login-form" autocomplete="on" novalidate>
      ${isNew?'<h2 class="acc-tit">Crear cuenta nueva</h2>':''}
      <div class="field acc-f"><label for="lg-email">Correo</label><input id="lg-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required value="${esc(store('sgm2-last-email')||'')}"></div>
      ${pwField('lg-pass','Contraseña',isNew?'new-password':'current-password')}
      ${isNew?'<p class="acc-help">Mínimo 8 caracteres.</p>'+pwField('lg-pass2','Repite la contraseña','new-password'):'<button type="button" class="acc-link olvido" data-act="forgot">¿Has olvidado tu contraseña?</button>'}
      <div id="lg-err" role="alert"></div>
      <button class="btn primary acc-btn" type="submit" id="lg-go">${isNew?'Crear cuenta y entrar':'Entrar'}</button>
      <button class="btn acc-btn" type="button" data-act="loginMode">${isNew?'Ya tengo cuenta: entrar':'Crear cuenta nueva'}</button>
      <p class="acc-note">Tus presupuestos, clientes y obras se guardan en tu cuenta y solo los ves tú.</p>
      <p class="acc-note">Al crear una cuenta aceptas las <button type="button" class="acc-link" data-legal="condiciones">condiciones de uso</button> y la <button type="button" class="acc-link" data-legal="privacidad">política de privacidad</button>.</p>
    </form>`);
  $('#login-form').addEventListener('submit',async e=>{e.preventDefault();const email=$('#lg-email').value.trim().toLowerCase(),pw=$('#lg-pass').value;const btn=$('#lg-go');
    const err=t=>{$('#lg-err').innerHTML=`<div class="err">${esc(t)}</div>`;btn.disabled=false;btn.textContent=isNew?'Crear cuenta y entrar':'Entrar'};
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return err('Escribe un correo válido.');
    if(isNew){if(pw.length<8)return err('La contraseña necesita al menos 8 caracteres.');if(pw!==$('#lg-pass2').value)return err('Las dos contraseñas no coinciden.')}
    btn.disabled=true;btn.textContent=isNew?'Creando la cuenta…':'Entrando…';$('#lg-err').innerHTML='';
    try{
      await api(isNew?'crear':'entrar',{email,clave:pw});sbStore({email});
      store('sgm2-last-email',email);LOGIN_MODE='in';AUTH=true;render();cloudStart()}
    catch(ex){err(authMsg(ex))}});
}
function vRecovery(){
  const tokenRec=new URLSearchParams(location.search).get('recuperar');
  accShell('Nueva contraseña','Elige una que recuerdes',`<form class="acc-form" id="rec-form" novalidate>
    ${pwField('rc-1','Contraseña nueva','new-password')}<p class="acc-help">Mínimo 8 caracteres.</p>
    ${pwField('rc-2','Repite la contraseña','new-password')}
    <div id="lg-err" role="alert"></div><button class="btn primary acc-btn" type="submit">Guardar contraseña</button></form>`,false);
  $('#rec-form').addEventListener('submit',async e=>{e.preventDefault();const a=$('#rc-1').value,b=$('#rc-2').value;const err=t=>$('#lg-err').innerHTML=`<div class="err">${esc(t)}</div>`;
    if(a.length<8)return err('La contraseña necesita al menos 8 caracteres.');if(a!==b)return err('Las dos contraseñas no coinciden.');
    try{const j=await api('nueva_clave',{token:tokenRec,clave:a});sbStore({email:j.email||''});
      try{history.replaceState(null,'',location.pathname)}catch(e){}AUTH=true;render();cloudStart();toast('Contraseña guardada')}
    catch(ex){err(authMsg(ex))}});
}

/* Cuando el navegador no deja usar el micrófono, se dicta con el del teclado: decir qué tecla según el aparato */
function guiaTeclado(){const u=navigator.userAgent||'';
  if(/iPhone|iPad|iPod/i.test(u))return 'Dicta en español con el teclado del iPhone: toca el cuadro de texto y pulsa el micrófono 🎙 que hay abajo a la derecha del teclado (o junto a la barra espaciadora). Habla y, al terminar, pulsa la flecha verde. Si no lo escribe en español: Ajustes › General › Teclado › Idiomas del dictado › Español.';
  if(/Android/i.test(u))return 'Dicta en español con el teclado: toca el cuadro de texto y pulsa el micrófono 🎙 del teclado (arriba a la derecha o junto a la barra espaciadora). Habla y, al terminar, pulsa la flecha verde.';
  if(/Mac/i.test(u))return 'En el Mac, con el dictado en español: haz clic en el cuadro de texto y pulsa dos veces la tecla Fn (o la tecla del micrófono 🎙). Habla y, al terminar, pulsa la flecha verde.';
  return 'En el ordenador, con Windows en español: haz clic en el cuadro de texto y pulsa a la vez la tecla Windows y la H. Habla y, al terminar, pulsa la flecha verde.'}
/* ---------- Dictar con la voz en cualquier campo ---------- */
const MIC='<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function micBtn(id,label='Dictar con la voz',inside=false){return `<button type="button" class="mic-btn${inside?' in':''}" data-act="dictar" data-target="${id}" aria-label="${label}" title="${label}">${MIC}</button>`}
let DICTADO=null;
function escuchar(onText,onEnd){
  const R=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!R){toast(guiaTeclado().replace('el cuadro de texto','el campo').replace(', pulsa la flecha verde','').replace(' y, al terminar.',''));return null}
  try{const r=new R();r.lang='es-ES';r.interimResults=true;r.continuous=true;let fin='';
    r.onresult=e=>{let tmp='';fin='';for(const x of e.results){if(x.isFinal)fin+=x[0].transcript+' ';else tmp+=x[0].transcript}onText((fin+tmp).trim(),false)};
    r.onerror=ev=>{if(ev.error!=='aborted'&&!fin)toast(guiaTeclado().replace('el cuadro de texto','el campo'))};
    r.onend=()=>{DICTADO=null;onEnd&&onEnd(fin.trim())};r.start();DICTADO=r;return r}catch(e){toast('No se ha podido usar el micrófono. Usa el del teclado.');return null}
}

function parseText(txt){
  const out=[];const segs=txt.toLowerCase().replace(/\s+y\s+/g,', ').split(/[,;\n.]+(?!\d)/).map(s=>s.trim()).filter(Boolean);
  for(const seg of segs){const r=RULES.find(([re])=>re.test(seg));if(!r)continue;const name=r[1];const info=itemInfo(name);
    const mu=[...seg.matchAll(/(\d+(?:[.,]\d+)?)\s*(m2|m²|metros?|ml|uds?|unidades|puntos?|horas)\b/g)];const m=mu.length?mu[mu.length-1]:seg.match(/(\d+(?:[.,]\d+)?)/);
    let qty=m?parseNum(m[1]):1;if(!qty)qty=1;
    const ex=out.find(o=>o.name===name);if(ex){ex.qty+=qty;continue}
    out.push({name,qty,unit:info?.unit||'ud',src:seg,on:true})}
  return out;
}

function aiRules(){
  const cat=catalog().map(c=>c.name+':\n'+c.items.map(i=>`- ${i.name} (${i.unit}, ${priceOf(i.name)} €)`).join('\n')).join('\n');
  return `Eres el asistente de presupuestos de Construcciones SGM, empresa de reformas y trabajos integrales en España. Ayudas a Sergio, el dueño, a montar presupuestos hablando, porque no se maneja bien con el ordenador.

Cómo trabajas:
- Usa SIEMPRE las herramientas para cambiar el presupuesto; no basta con decirlo.
- Usa el nombre EXACTO del catálogo cuando la partida exista. Si no existe, crea una partida con nombre claro, unidad y un precio razonable de mercado en España, y avísale para que lo revise.
- No pongas precio en partidas del catálogo salvo que Sergio diga un precio concreto: la app usa su tarifa.
- Calcula medidas: suelo = largo × ancho; alicatado o pintura de paredes = perímetro × altura (2,5 m si no la dice; restando ~2 m² por puerta). Pon la cuenta en la nota de la partida (ej.: "(2+2,5)×2×2,5 m − puerta").
- Añade lo que un profesional no olvidaría (retirada de escombros, protección, limpieza final) cuando tenga sentido, y díselo.
- Si falta un dato importante, pon una cantidad razonable y pregunta para confirmarla.
- Si Sergio nombra al cliente o el trabajo, usa datos_generales. No cambies el IVA del presupuesto por tu cuenta: si crees que corresponde otro (10 % en reforma de vivienda particular), propónselo y pregunta.
- Pon cada partida en su oficio con «oficio»: azulejos, colas, rejuntados y perfiles de remate en Alicatados y solados; puertas y ventanas de aluminio o PVC en Carpintería de aluminio/PVC; grifos, fregaderos y sanitarios en Fontanería y saneamiento. Nada en Otros trabajos si encaja en un oficio.
- Usa primero las partidas propias de Sergio ([propia]) cuando encajen.
- Responde en español de España, cercano y breve (2-4 frases): qué has añadido y qué necesitas saber. Nunca menciones herramientas, JSON ni detalles técnicos.

Clientes existentes: ${db.clients.map(c=>c.name).join('; ')||'ninguno'}.

Catálogo con la tarifa de Sergio:
${cat}`;
}
function aiState(){const q=S.ed.q,c=client(q.client);return `[Presupuesto ahora mismo]\nTítulo: ${q.title||'(sin título)'}\nCliente: ${c?c.name:'(sin elegir)'}\nIVA: ${q.iva} %\nPartidas:\n${q.lines.map(l=>`- ${l.name}: ${qtyFmt(l.qty)} ${l.unit} × ${l.price} €${l.note?' · '+l.note:''}`).join('\n')||'(ninguna)'}\nTotal con IVA: ${eur(calc(q).total)}`}
function findLine(q,name){const n=String(name||'').toLowerCase().trim();return q.lines.find(l=>l.name.toLowerCase()===n)||q.lines.find(l=>l.name.toLowerCase().includes(n)||n.includes(l.name.toLowerCase()))}
function aiNote(E,t){E.chat.push({role:'note',content:t});if(S.ed===E){edLines();edPicker();const h=$('.head h1');if(h)h.textContent=E.q.title||'Presupuesto sin título'}}
function aiTools(E){const q=E.q;return [
 {name:'anadir_partidas',description:'Añade partidas al presupuesto. Si la partida ya está, sustituye su cantidad. Devuelve lo que se ha hecho.',inputSchema:{type:'object',properties:{partidas:{type:'array',items:{type:'object',properties:{nombre:{type:'string',description:'Nombre exacto del catálogo, o uno nuevo y claro'},cantidad:{type:'number'},unidad:{type:'string',enum:UNITS},precio:{type:'number',description:'Solo si no está en el catálogo o Sergio dio un precio'},nota:{type:'string',description:'Medidas, estancia o acabado; visible para el cliente'},oficio:{type:'string',description:'Capítulo (oficio) donde va la partida, con el nombre exacto de un capítulo de trabajo de la tarifa'}},required:['nombre','cantidad']}}},required:['partidas']},
  execute(inp){const out=[];for(const p of (Array.isArray(inp.partidas)?inp.partidas:[])){const name=String(p.nombre||'').trim();if(!name)continue;const qty=Math.max(0,r2(+p.cantidad||1));const ex=q.lines.find(l=>l.name.toLowerCase()===name.toLowerCase());
    if(ex){ex.qty=qty;if(p.nota)ex.note=String(p.nota);if(p.precio!=null&&+p.precio>0)ex.price=r2(+p.precio);out.push('actualizada '+ex.name);continue}
    const info=itemInfo(name),of=capDeOficio(p.oficio);let l;if(info){l=mkLine(info.name,qty,p.nota?String(p.nota):'');if(p.precio!=null&&+p.precio>0)l.price=r2(+p.precio);if(of&&(l.mat||l.cap==='otr'))l.cap=of}else{l={id:uid(),cap:(capPorNombre(name)==='alicatados_solados'&&of==='aislamiento'?'alicatados_solados':of)||capPorNombre(name)||'otr',name,unit:UNITS.includes(p.unidad)?p.unidad:'ud',qty,price:r2(+p.precio||0),scope:SCOPES[0],note:p.nota?String(p.nota):''}}
    q.lines.push(l);out.push((info?'añadida ':'añadida (nueva, revisar precio) ')+l.name)}
   aiNote(E,'✓ '+out.length+' partida'+(out.length===1?'':'s')+': '+out.map(x=>x.replace(/^añadida (\(nueva, revisar precio\) )?|^actualizada /,'')).join(', '));return out.join('; ')||'nada'}},
 {name:'cambiar_partida',description:'Cambia la cantidad, el precio o la nota de una partida que ya está en el presupuesto.',inputSchema:{type:'object',properties:{nombre:{type:'string'},cantidad:{type:'number'},precio:{type:'number'},nota:{type:'string'}},required:['nombre']},
  execute(inp){const l=findLine(q,inp.nombre);if(!l)throw new Error('No está en el presupuesto: '+inp.nombre);if(inp.cantidad!=null)l.qty=Math.max(0,r2(+inp.cantidad));if(inp.precio!=null)l.price=Math.max(0,r2(+inp.precio));if(inp.nota!=null)l.note=String(inp.nota);aiNote(E,'✓ Cambiada: '+l.name+' ('+qtyFmt(l.qty)+' '+l.unit+' × '+eur(l.price)+')');return 'ok'}},
 {name:'quitar_partida',description:'Quita una partida del presupuesto.',inputSchema:{type:'object',properties:{nombre:{type:'string'}},required:['nombre']},
  execute(inp){const l=findLine(q,inp.nombre);if(!l)throw new Error('No está en el presupuesto: '+inp.nombre);q.lines=q.lines.filter(x=>x!==l);aiNote(E,'✓ Quitada: '+l.name);return 'ok'}},
 {name:'datos_generales',description:'Pone el título del trabajo y el cliente (si existe uno con ese nombre lo usa, si no lo crea). El IVA solo se cambia si Sergio lo pide expresamente.',inputSchema:{type:'object',properties:{titulo:{type:'string'},cliente:{type:'string'},telefono:{type:'string'},direccion:{type:'string'},iva:{type:'number',enum:[21,10,0]}}},
  execute(inp){const done=[];if(inp.titulo){q.title=String(inp.titulo);done.push('título')}
   if(inp.cliente){const n=String(inp.cliente).trim().toLowerCase();let c=db.clients.find(c=>c.name.toLowerCase()===n)||db.clients.find(c=>c.name.toLowerCase().includes(n)||n.includes(c.name.toLowerCase().split(' ')[0]));if(!c){c={id:uid(),name:String(inp.cliente).trim(),phone:String(inp.telefono||''),email:'',address:String(inp.direccion||''),nif:'',notes:''};db.clients.push(c);save();done.push('cliente nuevo '+c.name)}else done.push('cliente '+c.name);q.client=c.id}
   if(inp.iva!=null&&[0,10,21].includes(+inp.iva)&&+inp.iva!==+q.iva){const u=String((E.chat.filter(m=>m.role==='user').pop()||{}).content||'');if(/\biva\b/i.test(u)){q.iva=+inp.iva;done.push('IVA '+q.iva+' %')}else done.push('IVA sin cambiar ('+q.iva+' %): pregúntale a Sergio si quiere el '+(+inp.iva)+' %')}
   aiNote(E,'✓ '+done.join(' · '));return done.join(', ')||'nada'}},
 {name:'guardar_partida_propia',description:'Guarda en la biblioteca de partidas propias de Sergio un trabajo con su precio, para que salga en futuros presupuestos.',inputSchema:{type:'object',properties:{nombre:{type:'string'},oficio:{type:'string',description:'Nombre del capítulo de la tarifa, por ejemplo Electricidad; si no encaja, Otros trabajos'},unidad:{type:'string',enum:UNITS},precio:{type:'number',description:'Precio sin IVA'}},required:['nombre','unidad','precio']},
  execute(inp){const name=String(inp.nombre||'').trim();if(!name)throw new Error('Falta el nombre del trabajo');if(itemInfo(name))return 'Ya estaba en la tarifa: '+name;
   const price=r2(+inp.precio||0);if(!(price>0))throw new Error('Falta un precio mayor que 0');
   const unit=UNITS.includes(inp.unidad)?inp.unidad:'ud',cap=capDeOficio(inp.oficio)||capPorNombre(name)||'otr';
   db.custom.push({cap,name,unit,price});save();aiNote(E,'✓ Guardada en tu biblioteca: '+name+' ('+eur(price)+' / '+unit+')');return 'guardada en la biblioteca'}}
]}
function aiFallback(E,text){const f=parseText(text);for(const x of f){const ex=E.q.lines.find(l=>l.name===x.name);if(ex)ex.qty=x.qty;else E.q.lines.push(mkLine(x.name,x.qty))}
  if(f.length)aiNote(E,'✓ '+f.length+' partidas: '+f.map(x=>x.name+' ('+qtyFmt(x.qty)+' '+x.unit+')').join(', '));
  E.chat.push({role:'assistant',content:f.length?'He puesto estas partidas. Revisa las cantidades en la lista y cámbialas con − / + si hace falta.':'No he reconocido trabajos en ese mensaje. Prueba con palabras como «alicatar», «pintar», «plato de ducha» o «enchufes», separadas por comas.'})}
/* Asistente en la app publicada: api/asistente.php en el hosting (las reglas viven allí).
   Las herramientas se ejecutan aquí y se devuelven los resultados hasta que el asistente termina. */
function aiCloud(){return !DEMO&&!!CLOUD.session}
async function cloudAI(E,text,signal){
  const tools=aiTools(E),byName=Object.fromEntries(tools.map(t=>[t.name,t]));
  const hist=E.chat.filter(m=>m.role==='user'||m.role==='assistant').slice(-14,-1).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const msgs=[...hist,{role:'user',content:text+'\n\n'+aiState()}];
  const propias=(db.custom||[]).map(x=>`- ${x.name}: ${x.unit}, ${priceOf(x.name)} € [propia · ${capName(x.cap)}]`).join('\n');
  const tarifa=(propias?'PARTIDAS PROPIAS DE SERGIO (úsalas antes que la tarifa cuando encajen):\n'+propias+'\n\n':'')+'Capítulos de trabajo: '+CAPS_TRABAJO().map(c=>c.name).join(' · ')+'\n\n'+catalog().map(c=>c.name+':\n'+c.items.filter(i=>!i.custom).map(i=>`- ${i.name}: ${i.unit}, ${priceOf(i.name)} €`).join('\n')).join('\n');
  const clientes=db.clients.map(c=>c.name).join('; ');
  let last='';
  for(let turn=0;turn<8;turn++){
    let j;try{j=await api('asistente',{messages:msgs,tarifa,clientes},{signal})}
    catch(err){if(err.name==='AbortError')throw err;throw Object.assign(err,{code:err.status===429?'rate_limited':'cloud',text:err.message})}
    const content=Array.isArray(j.content)?j.content:[];
    const said=content.filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
    if(said){last=said;E.aiLive=said;const el=$('#ai-live');if(el&&S.ed===E){el.textContent=said;el.classList.remove('think')}}
    if(j.stop_reason==='refusal')return j.message||last;
    const uses=content.filter(b=>b.type==='tool_use');
    if(!uses.length)return last;
    msgs.push({role:'assistant',content});
    msgs.push({role:'user',content:uses.map(u=>{try{const t=byName[u.name];if(!t)throw new Error('Herramienta desconocida');return {type:'tool_result',tool_use_id:u.id,content:String(t.execute(u.input||{})??'ok')}}
      catch(err){return {type:'tool_result',tool_use_id:u.id,content:String(err&&err.message||err),is_error:true}}})});
  }
  return last;
}
async function aiSend(text){
  const E=S.ed;if(!E||E.busy)return;text=String(text||'').trim();if(!text)return;
  E.chat.push({role:'user',content:text});E.aiDraft='';E.busy=true;E.aiLive='';edPicker();
  if(!SAMPLE&&!aiCloud()){aiFallback(E,text);E.busy=false;edPicker();return}
  const hist=E.chat.filter(m=>m.role==='user'||m.role==='assistant').slice(-14);
  const turns=[{role:'user',content:aiRules()},...hist.slice(0,-1),{role:'user',content:text+'\n\n'+aiState()}];
  if(turns[1]&&turns[1].role==='assistant')turns.splice(1,1);
  const ctl=new AbortController();E.ctl=ctl;
  try{if(!SAMPLE){E.chat.push({role:'assistant',content:(await cloudAI(E,text,ctl.signal)).trim()||'Hecho. Revisa las partidas en la lista.'});return}
    const r=await SAMPLE(turns,{modelTier:'quick',signal:ctl.signal,tools:aiTools(E),onText:({text})=>{E.aiLive=text;const el=$('#ai-live');if(el&&S.ed===E){el.textContent=text;el.classList.remove('think');const b=$('#picker-body');if(b)b.scrollTop=b.scrollHeight}}});
    E.chat.push({role:'assistant',content:r.text.trim()})}
  catch(e){const code=e&&(e.name==='AbortError'?'cancelled':e.code);
    if(code==='cancelled'){if(e.text)E.chat.push({role:'assistant',content:e.text})}
    else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed','tools_unavailable'].includes(code)){SAMPLE=null;aiFallback(E,text)}
    else if(code==='rate_limited')E.chat.push({role:'assistant',content:(e.text?e.text+'\n\n':'')+'Ahora mismo hay demasiadas consultas. Espera un momento y vuelve a enviarlo.'})
    else E.chat.push({role:'assistant',content:(e&&e.text?e.text+'\n\n':'')+'Se ha cortado la respuesta. Vuelve a enviarlo, por favor.'})}
  finally{E.busy=false;E.ctl=null;E.aiLive='';if(S.ed===E){edLines();edPicker();setTimeout(()=>$('#ai-text')?.focus(),30)}}
}

const IN_CLAUDE=!!window.claude;

function pdfName(d,kind){const c=client(d.client);return ((kind==='quote'?'Presupuesto ':'Factura ')+(d.number||'borrador')+(c?' - '+c.name:'')+'.pdf').replace(/[\\/:*?"<>|]/g,'')}
async function addDocPages(pdf,d,kind,firstDoc){
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff';holder.innerHTML=docHTML(d,kind);document.body.append(holder);
  const paper=holder.firstElementChild;paper.style.boxShadow='none';paper.style.zoom='1';
  try{
    const sc=2,canvas=await window.html2canvas(paper,{scale:sc,backgroundColor:'#ffffff',logging:false});
    const top=paper.getBoundingClientRect().top;const cands=[...paper.querySelectorAll('tr,section,header')].map(e=>e.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
    const H=paper.offsetHeight,PH=1123,TP=44,BP=40,pages=[];let y=0;
    while(y<H-4){const first=!pages.length;const avail=PH-(first?0:TP)-BP;let end=y+avail;if(end<H){const c=cands.filter(v=>v>y+80&&v<=end);if(c.length)end=c[c.length-1]}else end=H;pages.push([y,end,first]);y=end}
    const W=pdf.internal.pageSize.getWidth(),Hh=pdf.internal.pageSize.getHeight();
    pages.forEach(([a,b,first],i)=>{const pc=document.createElement('canvas');pc.width=794*sc;pc.height=PH*sc;const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pc.width,pc.height);
      g.drawImage(canvas,0,a*sc,794*sc,(b-a)*sc,0,(first?0:TP)*sc,794*sc,(b-a)*sc);
      if(pages.length>1){g.fillStyle='#80847d';g.font=`${10*sc}px sans-serif`;g.textAlign='right';g.fillText(`${d.number||''} · Página ${i+1} de ${pages.length}`,(794-56)*sc,(PH-18)*sc)}
      if(!(firstDoc&&i===0))pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',0,0,W,Hh)});
  }finally{holder.remove()}
}
async function buildPDF(docs,name){
  if(!window.html2canvas||!window.jspdf){toast('Preparando el generador de PDF. Vuelve a pulsar en unos segundos.');return null}
  toast('Generando PDF…');
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    for(let i=0;i<docs.length;i++)await addDocPages(pdf,docs[i].d,docs[i].kind,i===0);
    return {blob:pdf.output('blob'),name:name||pdfName(docs[0].d,docs[0].kind)};
  }catch(e){toast('No se ha podido generar el PDF');return null}
}
async function saveFile(blob,name,msg='PDF guardado'){
  if(DL){try{await DL.save({filename:name,data:blob});toast(msg);return true}catch(e){if(e&&e.code!=='declined')toast('No se ha podido guardar el PDF');return false}}
  if(IN_CLAUDE){toast('La descarga no está disponible en esta vista');return false}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast(msg);return true;
}
/* Abre el menú «Compartir» del móvil u ordenador (WhatsApp, correo…) con el PDF adjunto */
async function shareFile(blob,name,text){
  let file=null;try{file=new File([blob],name,{type:'application/pdf'})}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:name,text});return true}catch(e){if(e&&e.name==='AbortError')return false}
  }
  const ok=await saveFile(blob,name);if(ok)toast('PDF listo: ábrelo y pulsa Compartir → WhatsApp o Correo');return ok;
}
async function downloadPDF(d,kind){const p=await buildPDF([{d,kind}]);if(p)await saveFile(p.blob,p.name)}

function normPhone(p){let d=String(p||'').replace(/[^\d+]/g,'');if(d.startsWith('00'))d='+'+d.slice(2);if(/^[6789]\d{8}$/.test(d))d='+34'+d;return d}
const waNum=p=>normPhone(p).replace(/\D/g,'');
const prettyPhone=p=>{const n=normPhone(p);const m=n.match(/^\+34(\d{3})(\d{2})(\d{2})(\d{2})$/);return m?`+34 ${m[1]} ${m[2]} ${m[3]} ${m[4]}`:(p||'')};
function parseVCF(txt){const out=[];let cur=null;
  for(const L of String(txt).replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('\n')){const u=L.toUpperCase();
    if(u.startsWith('BEGIN:VCARD')){cur={name:'',phones:[],emails:[]};continue}
    if(u.startsWith('END:VCARD')){if(cur&&(cur.name||cur.phones.length))out.push(cur);cur=null;continue}
    if(!cur)continue;const i=L.indexOf(':');if(i<0)continue;
    const k=L.slice(0,i).toUpperCase().split(';')[0].split('.').pop(),val=L.slice(i+1).replace(/\\([,;\\nN])/g,(m,c)=>/n/i.test(c)?' ':c).trim();
    if(k==='FN')cur.name=val;else if(k==='N'&&!cur.name){const p=val.split(';');cur.name=[p[1],p[0]].filter(Boolean).join(' ')}else if(k==='TEL')cur.phones.push(val);else if(k==='EMAIL')cur.emails.push(val)}
  return out}
function mergeContacts(list){let add=0;
  for(const c of list){const phone=normPhone((c.phones||[])[0]||''),name=String(c.name||'').trim()||phone;if(!name)continue;
    const ex=db.contacts.find(x=>(phone&&normPhone(x.phone)===phone)||x.name.toLowerCase()===name.toLowerCase());
    if(ex){if(!ex.phone&&phone)ex.phone=phone;if(!ex.email&&(c.emails||[])[0])ex.email=c.emails[0];continue}
    db.contacts.push({id:uid(),name,phone,email:(c.emails||[])[0]||''});add++}
  save();return add}
async function importAgenda(){
  if(navigator.contacts&&navigator.contacts.select){try{const r=await navigator.contacts.select(['name','tel','email'],{multiple:true});if(r&&r.length){const n=mergeContacts(r.map(x=>({name:(x.name||[])[0],phones:x.tel||[],emails:x.email||[]})));toast(n+' contactos nuevos');afterAgenda()}return}catch(e){}}
  dlg(`<div class="dlg-head"><h2>Traer contactos del móvil</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="dlg-body"><p style="margin:0">Este móvil no deja abrir la agenda desde aquí. Se hace en dos pasos y solo una vez:</p>

function people(q){const s=String(q||'').toLowerCase().trim();const cl=db.clients.map(c=>({key:'c:'+c.id,name:c.name,phone:c.phone,email:c.email,tag:'Cliente'}));
  const ph=new Set(cl.map(c=>normPhone(c.phone)).filter(Boolean));
  const ag=db.contacts.filter(k=>!ph.has(normPhone(k.phone))).map(k=>({key:'k:'+k.id,name:k.name,phone:k.phone,email:k.email,tag:'Agenda'}));
  return [...cl,...ag].filter(p=>!s||(p.name+' '+p.phone+' '+p.email).toLowerCase().includes(s)).sort((a,b)=>a.name.localeCompare(b.name,'es'))}

  if(kind==='quote'&&!d.number){d.number=nextNumber('PRE',db.quotes,d.date);if(S.ed&&!S.ed.isNew)edCommit()}
  const c=client(d.client);S.send={kind,id,to:c?{name:c.name,phone:c.phone,email:c.email}:null,picking:!c,q:''};renderSend()}

const enTarifaBase=name=>CAPS.some(c=>c.items.some(i=>i[0]===name));
function guardarEnMisPrecios(lines){let nuevas=0,cambiadas=0;
  for(const l of lines){const name=String(l.name||'').trim();if(!name||l.noGuardar||!(+l.price>0)||name==='Trabajo adicional'||enTarifaBase(name))continue;
    const cap=l.cap&&!/^mat_/.test(l.cap)?l.cap:(capPorNombre(name)||'otr'),price=r2(+l.price);
    const x=db.custom.find(c=>c.name.toLowerCase()===name.toLowerCase());
    if(x){if(r2(priceOf(x.name))!==price||x.unit!==l.unit||x.cap!==cap){x.price=price;x.unit=l.unit;x.cap=cap;delete db.prices[x.name];cambiadas++}}
    else{db.custom.push({cap,name,unit:l.unit,price});nuevas++}}
  return {nuevas,cambiadas}}
function capOpciones(sel){const ops=[...CAPS_TRABAJO().map(c=>[c.id,c.name]),['otr','Otros trabajos']];if(sel&&!ops.some(o=>o[0]===sel))ops.push([sel,capName(sel)]);return ops.map(([id,n])=>`<option value="${id}" ${id===sel?'selected':''}>${esc(n)}</option>`).join('')}

function copyText(t,msg){const ok=()=>toast(msg);try{navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok))}catch(e){fallbackCopy(t,ok)}}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}
