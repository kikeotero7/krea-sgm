<title>SGM Fichajes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: cabecera corporativa oscura con reloj vivo · contenido en columna centrada · barra inferior de secciones (tablet/móvil de obra) */
:root{
  --ink:#19211b;          /* cabecera SGM */
  --ink-2:#232d25;
  --bg:#f2f5f2;
  --surface:#ffffff;
  --surface-2:#f6f8f6;
  --line:#dde5de;
  --text:#18201a;
  --muted:#5d6a60;
  --green:#2f8a3e;        /* verde del logotipo SGM */
  --green-strong:#23702f;
  --green-soft:#e2eee3;
  --on-green:#ffffff;
  --amber:#a86a12;
  --amber-soft:#fbf0dc;
  --red:#bf3b2a;
  --red-soft:#fbe6e2;
  --blue:#2c6aa8;
  --blue-soft:#e3edf8;
  --violet:#6b4fa6;
  --violet-soft:#ece7f6;
  --shadow:0 1px 2px rgba(20,32,22,.06),0 8px 24px -12px rgba(20,32,22,.18);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#0b0f0c;--ink-2:#141a15;--bg:#0f1411;--surface:#171e19;--surface-2:#1c241e;--line:#2a352d;--text:#e5ebe6;--muted:#97a49a;
  --green:#5cbf6b;--green-strong:#79d487;--green-soft:#1c2e20;--on-green:#0b140d;--amber:#e3a94b;--amber-soft:#2e2414;--red:#ef7d6b;
  --red-soft:#331b17;--blue:#79aee6;--blue-soft:#172534;--violet:#b39ae6;--violet-soft:#241d33;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#0b0f0c;--ink-2:#141a15;--bg:#0f1411;--surface:#171e19;--surface-2:#1c241e;--line:#2a352d;--text:#e5ebe6;--muted:#97a49a;
  --green:#5cbf6b;--green-strong:#79d487;--green-soft:#1c2e20;--on-green:#0b140d;--amber:#e3a94b;--amber-soft:#2e2414;--red:#ef7d6b;
  --red-soft:#331b17;--blue:#79aee6;--blue-soft:#172534;--violet:#b39ae6;--violet-soft:#241d33;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-stretch:108%;letter-spacing:-.01em;text-wrap:balance;margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabecera */
.top{background:var(--ink);color:#eef3ef;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;border-bottom:3px solid #2f8a3e}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:14px}
.logo{width:64px;height:64px;border-radius:14px;background:#fff;flex:none;display:grid;place-items:center;overflow:hidden;box-shadow:0 4px 18px -6px rgba(0,0,0,.6)}
.logo img{width:100%;height:100%;object-fit:contain}
.brand{min-width:0;flex:1}
.eyebrow{font-family:var(--display);font-weight:700;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:#7fca8a}
.brand h1{font-size:clamp(20px,3.2vw,27px);font-weight:750;color:#fff;line-height:1.15}
.clock{text-align:right;flex:none}
.clock .t{font-family:var(--mono);font-weight:700;font-size:clamp(18px,3vw,26px);letter-spacing:.02em;color:#fff;line-height:1}
.clock .d{font-size:12px;color:#a9b8ac;margin-top:4px}
.topbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid #3a4a3d;background:#202a22;color:#e7efe8;padding:9px 14px;border-radius:10px;font-size:13.5px;font-weight:600;white-space:nowrap}
.topbtn:hover{background:#2a362c}
.topbtn svg{width:16px;height:16px}

main{padding-block:20px 120px}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 25%,var(--line));border-radius:12px;padding:10px 14px;font-size:13.5px;margin-bottom:18px}
.demo b{font-weight:700}
.demo .pins{display:flex;flex-wrap:wrap;gap:6px}
.demo .pin{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px 7px}
.demo .sp{flex:1}
.linkbtn{background:none;border:0;color:var(--green-strong);font-weight:600;padding:0;text-decoration:underline;text-underline-offset:3px}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{display:flex;justify-content:flex-start;gap:4px;overflow-x:auto;scrollbar-width:none;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
.nav .in::-webkit-scrollbar{display:none}
.nav button:first-child{margin-left:auto}.nav button:last-child{margin-right:auto}
.nav button{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:78px;padding:8px 8px 7px;border:0;border-radius:12px;background:none;color:var(--muted);font-size:12px;font-weight:600}
.nav button svg{width:21px;height:21px}
.nav button:hover{color:var(--text);background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--green-strong);background:var(--green-soft)}
.nav .badge{position:absolute;top:4px;right:16px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px;font-family:var(--mono)}

/* Bloques comunes */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h2{font-size:clamp(22px,3vw,28px);font-weight:750}
.head p{margin:2px 0 0;color:var(--muted);max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{padding:14px 16px}
.kpi .l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:34px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--red)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sec-t h3{font-size:17px;font-weight:700}
.sec-t small{color:var(--muted);font-size:12.5px}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--text);font-family:var(--display);font-size:16px;margin-bottom:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.primary:hover{background:var(--green-strong)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.85}
.chip.plain::before{display:none}
.chip.ok{background:var(--green-soft);color:var(--green-strong);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.info{background:var(--blue-soft);color:var(--blue);border-color:transparent}
.chip.vio{background:var(--violet-soft);color:var(--violet);border-color:transparent}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1}
.li .name{font-weight:650}
.li .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;flex:none;color:#fff}
.live{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 60%,transparent);animation:pulse 2s infinite;flex:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

.bar{height:8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}

/* Obras */
.obra{display:flex;flex-direction:column;gap:12px}
.obra .top-r{display:flex;align-items:flex-start;gap:10px}
.obra h3{font-size:18px;font-weight:750}
.obra .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.obra .meta span{display:inline-flex;align-items:center;gap:5px}
.obra .meta svg{width:14px;height:14px}
.avs{display:flex}
.avs .av{width:30px;height:30px;font-size:11.5px;border:2px solid var(--surface);margin-left:-7px;border-radius:9px}
.avs .av:first-child{margin-left:0}

/* Tablas */
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.daygroup td{background:var(--surface-2);font-weight:700;font-size:13px;padding:7px 12px;text-transform:capitalize}

/* Filtros y formularios */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:650;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;min-height:40px;width:100%}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:2px solid color-mix(in srgb,var(--green) 50%,transparent);border-color:var(--green)}
.form{display:grid;gap:14px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.f2{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--red);font-weight:600}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:grid;place-items:center;width:40px;height:36px;border-radius:9px;border:1px solid var(--line);font-weight:700;font-size:13px;background:var(--surface);cursor:pointer}
.days input:checked+span{background:var(--green);border-color:var(--green);color:var(--on-green)}
.days input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:650;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* Panel lateral */
.scrim{position:fixed;inset:0;background:rgba(8,12,9,.5);z-index:60;display:flex;justify-content:flex-end;animation:fade .18s ease}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:-20px 0 50px -20px rgba(0,0,0,.5);animation:slide .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) 14px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet header h3{font-size:19px;font-weight:750;flex:1}
.sheet .body{padding:18px max(18px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 18px;display:grid;gap:16px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}

/* Toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(440px,calc(100% - 32px))}
.toast{background:var(--ink);color:#f1f5f2;border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600;box-shadow:0 14px 30px -12px rgba(0,0,0,.5);display:flex;gap:9px;align-items:center;animation:up .25s ease;width:100%}
.toast svg{width:18px;height:18px;flex:none;color:#7fca8a}
.toast.bad svg{color:#ff9a88}
@keyframes up{from{transform:translateY(12px);opacity:0}}

/* Fichar */
.kiosk{max-width:620px;margin:0 auto}
.kiosk .card{padding:26px clamp(18px,4vw,36px)}
.k-date{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:13.5px}
.k-date svg{width:17px;height:17px}
.k-title{text-align:center;margin-top:12px}
.k-title h2{font-size:clamp(23px,3.6vw,28px);font-weight:750}
.k-title p{color:var(--muted);margin:4px 0 0}
.dots{display:flex;justify-content:center;gap:14px;margin:26px 0 22px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);transition:all .15s}
.dots i.on{background:var(--green);border-color:var(--green);transform:scale(1.1)}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.key{height:clamp(62px,9vh,86px);border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--display);font-stretch:110%;font-weight:750;font-size:28px;display:grid;place-items:center;transition:transform .06s,background .15s;user-select:none}
.key:hover{background:var(--green-soft)}
.key:active{transform:scale(.96)}
.key svg{width:26px;height:26px}
.key.ok{background:var(--green);border-color:var(--green);color:var(--on-green)}
.key.ok[disabled]{opacity:.45}
.k-foot{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;margin-top:16px}
.k-foot svg{width:15px;height:15px}
.k-sign{border-top:1px solid var(--line);margin-top:20px;padding-top:12px;text-align:center;font-size:12px;color:var(--muted)}
.hello{display:flex;align-items:center;gap:14px}
.hello .av{width:54px;height:54px;font-size:19px;border-radius:15px}
.hello h2{font-size:24px}
.state{margin:20px 0;border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--surface-2);display:flex;gap:14px;align-items:center}
.state .big{font-family:var(--mono);font-weight:700;font-size:30px;line-height:1}
.state.on{background:var(--green-soft);border-color:transparent}
.state.warn{background:var(--amber-soft);border-color:transparent}
.cta{width:100%;min-height:74px;border-radius:16px;border:0;font-family:var(--display);font-stretch:112%;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--green);color:var(--on-green);box-shadow:0 12px 28px -14px color-mix(in srgb,var(--green) 80%,transparent)}
.cta:hover{background:var(--green-strong)}
.cta.out{background:var(--ink);color:#fff}
.cta.out:hover{background:var(--ink-2)}
.cta svg{width:26px;height:26px}
.checks{display:grid;gap:10px;margin:18px 0}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2)}
.check .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.check .ic svg{width:17px;height:17px}
.check.ok .ic{background:var(--green-soft);color:var(--green-strong)}
.check.warn .ic{background:var(--amber-soft);color:var(--amber)}
.check.wait .ic{background:var(--blue-soft);color:var(--blue)}
.spin{width:17px;height:17px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.done{text-align:center;padding:14px 0}
.done .ring{width:96px;height:96px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--green);color:var(--on-green);animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.done .ring.warn{background:var(--amber)}
.done .ring svg{width:48px;height:48px;stroke-width:3}
.done .tt{font-family:var(--mono);font-weight:700;font-size:44px;margin:8px 0}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.receipt{display:inline-flex;gap:8px;font-family:var(--mono);font-size:13px;padding:6px 12px;border-radius:9px;border:1px dashed var(--line);color:var(--muted)}

/* Asistencia */
.att{border-collapse:separate;border-spacing:3px;font-size:12px}
.att th{padding:4px 2px;text-align:center;font-size:10.5px;letter-spacing:0;border:0}
.att th.n,.att td.n{text-align:left;padding:4px 8px 4px 0;white-space:nowrap;font-size:13px;font-weight:650;position:sticky;left:0;background:var(--surface);z-index:1}
.att td{padding:0;border:0}
.att .c{width:26px;height:30px;border-radius:7px;border:0;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.att .c:hover{outline:2px solid var(--green)}
.att .wk{color:var(--muted);opacity:.55}
.att th.today{color:var(--green-strong)}
.c.trab{background:var(--green);color:var(--on-green)}
.c.anot{background:var(--green-soft);color:var(--green-strong);box-shadow:inset 0 0 0 1.5px var(--green)}
.c.falta{background:var(--red);color:#fff}
.c.just{background:var(--blue-soft);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
.c.vac{background:var(--violet-soft);color:var(--violet);box-shadow:inset 0 0 0 1.5px var(--violet)}

  const now=Date.now(),today=new Date();today.setHours(0,0,0,0);

  const obras=[
    {id:'o1',name:'Reforma Nervión',type:'Reforma integral',address:'Av. Eduardo Dato 41, 3.º B · Sevilla',description:'Reforma integral de vivienda de 110 m²: demolición, fontanería, electricidad, solería y carpintería.',status:'En curso',progress:62,end_date:dkey(daysAgo(-34)),lat:37.38274,lng:-5.97316,radius:150},

/* ───────────── Reglas de jornada ───────────── */
function especialFor(d){return S.cfg.especiales.find(x=>x.date===dkey(d))}
function scheduleFor(d){
  d=new Date(d);const se=S.cfg.seasons[S.cfg.season];const x=especialFor(d);
  if(x){if(x.type==='off')return null;return{start:x.start,end:x.end,margin:se.margin,special:x.label}}
  if(!se.days.includes(d.getDay()))return null;
  return{start:se.start,end:se.end,margin:se.margin};
}
function schedCheck(kind,t){
  const sc=scheduleFor(t);if(!sc)return'offday';
  const d=new Date(t),m=d.getHours()*60+d.getMinutes(),ref=toMin(kind==='in'?sc.start:sc.end);
  if(m<ref-sc.margin)return'early';
  if(m>ref+sc.margin)return kind==='in'?'late':'after';
  return'ok';
}
const SCHED={ok:['Dentro del margen horario','ok'],early:['',''],late:['Entrada con retraso','warn'],after:['Salida posterior al horario','warn'],offday:['Fuera de los días previstos','warn']};
const schedLabel=(kind,s)=>s==='early'?[kind==='in'?'Entrada anticipada':'Salida anticipada','warn']:SCHED[s]||['Sin comprobar',''];
const ZONE={in:['Dentro de una zona de trabajo','ok'],out:['Fuera de las zonas de trabajo','warn'],imprecise:['Ubicación poco precisa','warn'],na:['Ubicación no disponible','warn'],nozones:['Zonas sin configurar','info']};
function zoneOf(p){
  const zs=S.obras.filter(o=>o.status==='En curso'&&o.lat!=null&&o.lng!=null);
  if(!zs.length)return{zone:'nozones'};
  if(!p||p.lat==null)return{zone:'na'};
  let best=null;zs.forEach(o=>{const d=haversine(p.lat,p.lng,o.lat,o.lng);if(!best||d-o.radius<best.d-best.o.radius)best={o,d}});
  if(best.d<=best.o.radius)return{zone:'in',dist:Math.round(best.d),obra:best.o.id};
  if((p.acc||0)>Math.max(150,best.o.radius*1.5))return{zone:'imprecise',dist:Math.round(best.d),obra:best.o.id};
  return{zone:'out',dist:Math.round(best.d),obra:best.o.id};
}
const punchIssues=(p,kind)=>{const r=[];if(!p)return r;if(p.zone!=='in'&&p.zone!=='nozones')r.push(ZONE[p.zone][0]);if(p.sched!=='ok')r.push(schedLabel(kind,p.sched)[0]);return r};
const isStale=f=>!f.out&&!sameDay(f.in.t,Date.now());
function needsReview(f){
  if(f.review)return false;
  return isStale(f)||punchIssues(f.in,'in').length>0||punchIssues(f.out,'out').length>0||!!f.late;
}
const empById=id=>S.emps.find(e=>e.id===id);
const obraById=id=>S.obras.find(o=>o.id===id);
const openToday=empId=>S.fich.find(f=>f.emp===empId&&!f.out&&sameDay(f.in.t,Date.now()));
const fichOf=(empId,day)=>S.fich.filter(f=>f.emp===empId&&sameDay(f.in.t,day));
const worked=f=>f.out?f.out.t-f.in.t:isStale(f)?0:Date.now()-f.in.t;
const pendingCount=()=>S.fich.filter(needsReview).length+S.reqs.filter(r=>r.state==='pending').length;

  const pc=pendingCount();

function vResumen(){
  const now=Date.now(),today=new Date();

  const open=S.fich.filter(f=>!f.out&&sameDay(f.in.t,now));
  const pc=pendingCount();
  const sc=scheduleFor(today);
  const late=sc&&now>atTime(today,sc.start,sc.margin)?act.filter(e=>e.obra&&!fichOf(e.id,today).length&&!S.notes.some(n=>n.emp===e.id&&n.date===dkey(today))):[];
  // horas de los últimos 7 días
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const ms=S.fich.filter(f=>sameDay(f.in.t,d)).reduce((a,f)=>a+worked(f),0);days.push({d,h:ms/3600000})}
  const maxH=Math.max(8,...days.map(x=>x.h));const niceMax=Math.ceil(maxH/10)*10;
  const W=420,H=210,pl=30,pb=26,pt=18,bw=(W-pl-10)/7;

  const ticks=[0,niceMax/2,niceMax];
  const chart=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas trabajadas por el equipo en los últimos siete días">
    ${ticks.map(t=>`<line x1="${pl}" x2="${W-6}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="${t?'3 4':'0'}"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end" font-size="12" fill="var(--muted)" font-family="var(--mono)">${t}</text>`).join('')}
    ${days.map((x,i)=>{const bx=pl+i*bw+bw*.2,bh=Math.max(0,H-pb-y(x.h)),isT=i===6;return `<rect x="${bx}" y="${y(x.h)}" width="${bw*.6}" height="${bh}" rx="5" fill="${isT?'var(--green)':'color-mix(in srgb,var(--green) 45%,var(--surface-2))'}"/>${x.h?`<text x="${bx+bw*.3}" y="${y(x.h)-5}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--text)" font-family="var(--mono)">${hrs(x.h*3600000)}</text>`:''}<text x="${bx+bw*.3}" y="${H-8}" text-anchor="middle" font-size="12" fill="${isT?'var(--green-strong)':'var(--muted)'}" font-weight="${isT?700:500}">${DOW[x.d.getDay()]} ${x.d.getDate()}</text>`}).join('')}
  </svg>`;
  return `
  <div class="head"><div><div class="eyebrow" style="color:var(--green)">Control del equipo</div><h2>${sc?(sc.special?esc(sc.special):'Jornada de hoy'):'Hoy no hay jornada prevista'}</h2><p>${sc?`Horario de ${S.cfg.season} · ${sc.start} a ${sc.end} · margen de ${sc.margin} min`:esc(especialFor(today)?.label||'Día no laborable según el calendario de trabajo')}</p></div>
  <button class="btn" data-go="fichar">${ic('pin')}Abrir fichaje</button></div>
  <div class="kpis">
    <div class="card kpi"><div class="l">Obras en curso</div><div class="v">${enCurso.length}</div><div class="s">${S.obras.filter(o=>o.status==='Pendiente').length} pendientes de inicio</div></div>
    <div class="card kpi"><div class="l">Equipo activo</div><div class="v">${act.length}</div><div class="s">${act.filter(e=>!e.obra).length?act.filter(e=>!e.obra).length+' sin obra asignada':'Todos con obra asignada'}</div></div>
    <div class="card kpi"><div class="l">Trabajando ahora</div><div class="v" style="color:var(--green-strong)">${open.length}</div><div class="s">${S.fich.filter(f=>f.out&&sameDay(f.in.t,now)).length} jornadas cerradas hoy</div></div>
    <div class="card kpi ${pc?'alert':''}"><div class="l">Por revisar</div><div class="v">${pc}</div><div class="s">${pc?'Incidencias y correcciones':'Todo revisado'}</div></div>
  </div>
  <div class="grid g2">
    <section class="card"><div class="pad" style="padding-bottom:6px"><div class="sec-t"><h3>Trabajando ahora</h3><small>En directo</small></div></div>
      <div class="list">${open.length?open.map(f=>{const e=empById(f.emp),o=obraById(f.obra);const iss=punchIssues(f.in,'in');return `<div class="li"><div class="av" style="background:${avColor(e.id)}">${ini(e.name)}</div><div class="main"><div class="name">${esc(e.name)}</div><div class="sub">${esc(o?.name||'Sin obra')} · desde ${hm(f.in.t)}</div>${iss.length?`<div style="margin-top:4px">${iss.map(x=>`<span class="chip warn">${esc(x)}</span>`).join(' ')}</div>`:''}</div><div class="row" style="gap:8px"><span class="pulse"></span><span class="live" data-since="${f.in.t}">--:--:--</span></div></div>`}).join(''):'<div class="empty"><b>Todavía no hay entradas abiertas.</b>Las entradas de hoy aparecerán aquí al momento.</div>'}</div>
    </section>
    <section class="card"><div class="pad" style="padding-bottom:6px"><div class="sec-t"><h3>Avisos de fichaje</h3><button class="btn sm ghost" data-act="push">${ic('bell')}Activar avisos</button></div><p class="small muted" style="margin:0">Revisa sus horarios antes de considerar una ausencia.</p></div>
      <div class="list">${late.length?late.map(e=>`<div class="li"><div class="av" style="background:${avColor(e.id)}">${ini(e.name)}</div><div class="main"><div class="name">${esc(e.name)}</div><div class="sub">${esc(obraById(e.obra)?.name||'')} · sin entrada a las ${sc.start}</div></div><span class="chip warn">Sin fichaje</span></div>`).join(''):'<div class="empty">Sin avisos pendientes de entrada hoy.</div>'}</div>
    </section>
    <section class="card pad"><div class="sec-t"><h3>Horas del equipo</h3><small>Últimos 7 días</small></div>${chart}</section>
    <section class="card pad"><div class="sec-t"><h3>Obras</h3><button class="btn sm ghost" data-go="obras">Ver obras ${ic('right')}</button></div>
      <div class="grid" style="gap:14px">${S.obras.filter(o=>o.status!=='Finalizada').map(o=>{const n=S.fich.filter(f=>f.obra===o.id&&!f.out&&sameDay(f.in.t,now)).length;return `<div><div class="row" style="justify-content:space-between"><b>${esc(o.name)}</b><span class="small muted">${n?`<span class="chip ok">${n} trabajando</span> `:''}<span class="num">${o.progress}%</span></span></div><div class="bar" style="margin-top:6px"><i style="width:${o.progress}%"></i></div></div>`}).join('')}</div>
    </section>
  </div>`;
}

/* ───────────── Obras ───────────── */
const statusChip=s=>`<span class="chip ${s==='En curso'?'ok':s==='Pendiente'?'warn':'plain'}">${esc(s)}</span>`;
function vObras(){
  const now=Date.now();
  return `<div class="head"><div><h2>Obras</h2><p>Organiza cada obra, su estado y la zona donde se comprueban los fichajes.</p></div><button class="btn primary" data-act="newObra">${ic('plus')}Nueva obra</button></div>
  ${S.obras.length?`<div class="grid g2">${S.obras.map(o=>{const team=S.emps.filter(e=>e.obra===o.id);const open=S.fich.filter(f=>f.obra===o.id&&!f.out&&sameDay(f.in.t,now)).length;const wk=S.fich.filter(f=>f.obra===o.id&&now-f.in.t<7*864e5).reduce((a,f)=>a+worked(f),0);return `
   <article class="card pad obra">
     <div class="top-r"><div style="flex:1;min-width:0"><div class="small muted">${esc(o.type||'')}</div><h3>${esc(o.name)}</h3></div>${statusChip(o.status)}</div>
     <div class="meta"><span>${ic('pin')}${esc(o.address||'Sin dirección')}</span>${o.lat!=null?`<span>${ic('locate')}Zona de ${o.radius} m</span>`:'<span class="chip warn">Zona sin fijar</span>'}${o.end_date?`<span>${ic('cal')}Fin previsto ${new Date(fromKey(o.end_date)).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}</span>`:''}</div>
     <div><div class="row" style="justify-content:space-between;font-size:13px"><span class="muted">Avance</span><b class="num">${o.progress}%</b></div><div class="bar" style="margin-top:5px"><i style="width:${o.progress}%"></i></div></div>
     <div class="row"><div class="avs">${team.map(e=>`<div class="av" title="${esc(e.name)}" style="background:${avColor(e.id)}">${ini(e.name)}</div>`).join('')||'<span class="small muted">Sin empleados asignados.</span>'}</div><span class="sp"></span>${open?`<span class="chip ok">Jornada abierta aquí · ${open}</span>`:''}<span class="small muted num">${hrs(wk)} h esta semana</span></div>
     <div class="row"><button class="btn sm" data-act="editObra" data-id="${o.id}">${ic('edit')}Editar</button>${o.lat!=null?`<a class="btn sm ghost" target="_blank" rel="noopener" href="https://www.google.com/maps?q=${o.lat},${o.lng}">${ic('ext')}Ver punto</a>`:''}</div>
   </article>`}).join('')}</div>`:`<div class="card empty"><b>Todavía no hay obras</b>Añade la primera obra y asigna a sus trabajadores.</div>`}`;
}
function zoneMap(o){
  if(o.lat==null)return '<div class="zmap empty">Fija el punto de la obra para ver la zona.</div>';
  const W=480,H=220,cx=W/2,cy=H/2,scale=80/o.radius;
  const pts=S.fich.filter(f=>f.obra===o.id).slice(-40).flatMap(f=>[f.in,f.out]).filter(p=>p&&p.lat!=null).map(p=>{const dy=(p.lat-o.lat)*111320,dx=(p.lng-o.lng)*111320*Math.cos(o.lat*Math.PI/180);return{x:cx+dx*scale,y:cy-dy*scale,ok:p.zone==='in'}}).filter(p=>p.x>4&&p.x<W-4&&p.y>4&&p.y<H-4);
  return `<div class="zmap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Zona de ${o.radius} metros alrededor de la obra con los últimos fichajes">
   <defs><pattern id="gr" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" fill="none" stroke="var(--line)" stroke-width="1"/></pattern></defs>
   <rect width="${W}" height="${H}" fill="url(#gr)"/>
   <circle cx="${cx}" cy="${cy}" r="160" fill="none" stroke="var(--line)" stroke-dasharray="4 5"/>
   <circle cx="${cx}" cy="${cy}" r="80" fill="color-mix(in srgb,var(--green) 14%,transparent)" stroke="var(--green)" stroke-width="2"/>
   ${pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${p.ok?'var(--green-strong)':'var(--amber)'}" stroke="var(--surface)" stroke-width="1.5"/>`).join('')}
   <g transform="translate(${cx-11} ${cy-26})"><path d="M11 0a9 9 0 0 1 9 9c0 7-9 15-9 15S2 16 2 9a9 9 0 0 1 9-9z" fill="var(--ink)"/><circle cx="11" cy="9" r="3.4" fill="#7fca8a"/></g>
   <text x="${cx+84}" y="${cy-4}" font-size="12" font-family="var(--mono)" fill="var(--green-strong)">${o.radius} m</text>
   <text x="${cx+164}" y="${cy-4}" font-size="12" font-family="var(--mono)" fill="var(--muted)">${o.radius*2} m</text>
   <text x="12" y="${H-12}" font-size="12" font-family="var(--mono)" fill="var(--muted)">${o.lat.toFixed(5)}, ${o.lng.toFixed(5)}</text>
  </svg></div>`;
}
function parseCoords(s){
  s=String(s||'').trim();let m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|query|ll)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/)||s.match(/^(-?\d{1,2}\.\d+)\s*[,;\s]\s*(-?\d{1,3}\.\d+)$/);
  if(!m)return null;const lat=+m[1],lng=+m[2];if(Math.abs(lat)>90||Math.abs(lng)>180)return null;return{lat,lng};
}
function obraForm(o){
  const isNew=!o;o=o||{id:'',name:'',type:'',address:'',description:'',status:'En curso',progress:0,end_date:'',lat:null,lng:null,radius:120};

  sheet(isNew?'Nueva obra':'Editar obra',`
  <form class="form" id="fObra" novalidate>

      <div class="field"><label for="o_rad">Radio de la zona · <b id="o_radv" class="num">${o.radius} m</b></label><input id="o_rad" type="range" min="50" max="500" step="10" value="${o.radius}"></div>
      <div class="row"><button class="btn sm" type="button" id="o_geo">${ic('locate')}Usar mi ubicación · estando en la obra</button><a class="btn sm ghost" id="o_gmaps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.address||'')}">${ic('ext')}Buscar la dirección en Google Maps</a></div>
      <div class="hint" id="o_msg"></div>
    </div>
    ${isNew?'':`<div><div class="lbl" style="margin-bottom:6px">Equipo asignado</div>${team.length?`<div class="row">${team.map(e=>`<span class="chip plain">${esc(e.name)}</span>`).join('')}</div>`:'<span class="hint">Sin empleados asignados. Después podrás asignar el equipo desde la pestaña Equipo.</span>'}</div>`}
    <div class="err" id="o_err"></div>
    <div class="row"><button class="btn primary" type="submit">${ic('check')}Guardar obra</button>${isNew?'':`<span class="sp"></span><button class="btn danger" type="button" id="o_delete">Eliminar</button>`}</div>
  </form>`);
  const upd=()=>{const lat=parseFloat($('#o_lat').value),lng=parseFloat($('#o_lng').value),r=+$('#o_rad').value;$('#o_radv').textContent=r+' m';$('#o_map').innerHTML=zoneMap({...o,lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng,radius:r})};
  $('#o_prog').oninput=e=>$('#o_progv').textContent=e.target.value+'%';
  $('#o_rad').oninput=upd;$('#o_lat').oninput=upd;$('#o_lng').oninput=upd;
  $('#o_addr').oninput=e=>$('#o_gmaps').href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(e.target.value);
  $('#o_paste').oninput=e=>{const c=parseCoords(e.target.value);if(c){$('#o_lat').value=c.lat.toFixed(6);$('#o_lng').value=c.lng.toFixed(6);upd();$('#o_msg').textContent='Punto preparado. Compruébalo en el mapa y guarda la obra.'}else if(e.target.value.trim())$('#o_msg').textContent='No encuentro coordenadas en ese texto. Usa un enlace largo que incluya el punto.'};
  $('#o_geo').onclick=()=>{$('#o_msg').textContent='Comprobando ubicación…';getLoc().then(p=>{$('#o_lat').value=p.lat.toFixed(6);$('#o_lng').value=p.lng.toFixed(6);upd();$('#o_msg').textContent=`Punto preparado con precisión de ${Math.round(p.acc)} m. Compruébalo y guarda la obra.`}).catch(()=>{$('#o_msg').textContent='Ubicación no disponible en este dispositivo. Pega las coordenadas del punto.'})};
  if(!isNew)$('#o_delete').onclick=()=>confirmIn($('#o_delete'),'Eliminar obra',()=>{S.obras=S.obras.filter(x=>x.id!==o.id);S.emps.forEach(e=>{if(e.obra===o.id)e.obra=''});save();closeSheet();render();toast('Obra eliminada')});
  $('#fObra').onsubmit=ev=>{ev.preventDefault();
    const name=$('#o_name').value.trim();if(!name){$('#o_err').textContent='Escribe el nombre de la obra.';return}
    const lat=parseFloat($('#o_lat').value),lng=parseFloat($('#o_lng').value);
    const rec={...o,id:o.id||'o'+uid(),name,type:$('#o_type').value.trim(),status:$('#o_status').value,address:$('#o_addr').value.trim(),description:$('#o_desc').value.trim(),progress:+$('#o_prog').value,end_date:$('#o_end').value,lat:isNaN(lat)?null:lat,lng:isNaN(lng)?null:lng,radius:+$('#o_rad').value};
    if(isNew)S.obras.push(rec);else Object.assign(S.obras.find(x=>x.id===o.id),rec);
    logA(`Obra ${isNew?'creada':'actualizada'}: ${name}`);save();closeSheet();render();toast('Obra guardada');
  };
}

    <label class="row small" style="gap:8px"><input type="checkbox" id="e_active" ${e.active?'checked':''}> Empleado en activo</label>
    <p class="hint" style="margin:0">Cada PIN es único. La jornada conserva la obra de entrada; la ubicación de salida puede corresponder a otra obra en curso. La fecha de alta delimita el calendario de asistencia.</p>
    <div class="err" id="e_err"></div>
    <div class="row"><button class="btn primary" type="submit">${ic('check')}Guardar empleado</button><button class="btn" type="button" id="e_gen">Generar PIN</button></div>
  </form>`);
  $('#e_gen').onclick=()=>{let p;do{p=String(Math.floor(1000+Math.random()*9000))}while(S.emps.some(x=>x.pin===p));$('#e_pin').value=p};
  $('#fEmp').onsubmit=ev=>{ev.preventDefault();
    const name=$('#e_name').value.trim(),pin=$('#e_pin').value.trim();
    if(!name)return $('#e_err').textContent='Escribe el nombre del empleado.';
    if(!/^\d{4}$/.test(pin))return $('#e_err').textContent='El PIN debe tener cuatro dígitos.';
    if(S.emps.some(x=>x.pin===pin&&x.id!==e.id))return $('#e_err').textContent='Este código ya está asignado a otro empleado.';
    const rec={...e,id:e.id||'e'+uid(),name,role:$('#e_role').value.trim(),pin,alta:$('#e_alta').value||dkey(new Date()),obra:$('#e_obra').value,active:$('#e_active').checked};
    if(isNew)S.emps.push(rec);else Object.assign(S.emps.find(x=>x.id===e.id),rec);
    logA(`Empleado ${isNew?'añadido':'actualizado'}: ${name}`);save();closeSheet();render();toast('Empleado guardado');
  };
}

/* ───────────── Fichajes ───────────── */
function filtered(){
  const {emp,obra,period}=U.filt;const d=new Date();d.setHours(0,0,0,0);
  let from=0;if(period==='hoy')from=d.getTime();else if(period==='7')from=d.getTime()-6*864e5;else if(period==='mes')from=new Date(d.getFullYear(),d.getMonth(),1).getTime();else if(period==='30')from=d.getTime()-29*864e5;
  return S.fich.filter(f=>(!emp||f.emp===emp)&&(!obra||f.obra===obra)&&f.in.t>=from).sort((a,b)=>b.in.t-a.in.t);
}
function punchChips(p,kind){if(!p)return'';const z=ZONE[p.zone]||['',''];const s=schedLabel(kind,p.sched);return `<span class="chip ${z[1]}" title="${p.dist!=null?p.dist+' m del punto de la obra':''}">${esc(z[0])}${p.dist!=null&&p.zone!=='in'?` · ${p.dist} m`:''}</span> <span class="chip ${s[1]}">${esc(s[0])}</span>`}
function vFichajes(){
  const rows=filtered();const total=rows.reduce((a,f)=>a+worked(f),0);
  let last='';
  return `<div class="head"><div><h2>Historial de fichajes</h2><p>Registro diario de jornada con hora real, obra y comprobación de ubicación y horario. Se conserva cuatro años (art. 34.9 del Estatuto de los Trabajadores).</p></div><button class="btn" data-act="csv">${ic('down')}Exportar CSV</button></div>
  <div class="filters">
    <div class="field"><label for="fl_emp">Empleado</label><select class="inp" id="fl_emp"><option value="">Todo el equipo</option>${S.emps.map(e=>`<option value="${e.id}" ${U.filt.emp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="fl_obra">Obra</label><select class="inp" id="fl_obra"><option value="">Todas las obras</option>${S.obras.map(o=>`<option value="${o.id}" ${U.filt.obra===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
    <div class="field"><span class="lbl">Periodo</span><div class="seg" role="group" aria-label="Periodo">${[['hoy','Hoy'],['7','7 días'],['mes','Este mes'],['30','30 días']].map(([k,l])=>`<button type="button" data-per="${k}" aria-pressed="${U.filt.period===k}">${l}</button>`).join('')}</div></div>
    ${U.filt.emp||U.filt.obra?`<button class="btn sm ghost" data-act="clearF">Limpiar</button>`:''}
    <span class="sp"></span><div class="small muted" style="text-align:right"><b class="num" style="font-size:18px;color:var(--text)">${hrs(total)} h</b><br>${rows.length} jornadas</div>
  </div>
  <div class="card tablewrap">${rows.length?`<table><thead><tr><th>Empleado</th><th>Obra</th><th>Entrada</th><th>Salida</th><th>Horas</th><th>Comprobación</th></tr></thead><tbody>${rows.map(f=>{const e=empById(f.emp),o=obraById(f.obra);const k=dkey(f.in.t);const g=k!==last?(last=k,`<tr class="daygroup"><td colspan="6">${fDay(f.in.t)}</td></tr>`):'';const nr=needsReview(f);return g+`<tr>
     <td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="av" style="width:28px;height:28px;font-size:11px;border-radius:8px;background:${avColor(e?.id||'x')}">${ini(e?.name||'?')}</div><b style="white-space:nowrap">${esc(e?.name||'—')}</b></div></td>
     <td class="small">${esc(o?.name||'—')}</td>
     <td class="num">${hm(f.in.t)}</td>
     <td class="num">${f.out?hm(f.out.t):isStale(f)?'<span class="chip bad">Salida pendiente</span>':'<span class="chip ok plain">Abierta</span>'}</td>
     <td class="num">${f.out?dur(f.out.t-f.in.t):`<span class="live" data-since="${f.in.t}"></span>`}</td>
     <td style="min-width:260px"><div style="display:flex;flex-wrap:wrap;gap:4px">${punchChips(f.in,'in')}${f.out?' '+punchChips(f.out,'out'):''}</div>${f.note?`<div class="small muted" style="margin-top:5px">“${esc(f.note)}”</div>`:''}${f.review?`<div class="small" style="margin-top:4px;color:var(--green-strong)">${ic('shield','style="width:13px;height:13px;vertical-align:-2px"')} Revisado por ${esc(f.review.by)}${f.review.note?' · '+esc(f.review.note):''}</div>`:nr?'<div style="margin-top:5px"><span class="chip warn">Pendiente de revisión</span></div>':''}${f.source==='correccion'?'<div style="margin-top:4px"><span class="chip info">Corrección aprobada</span></div>':''}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No hay fichajes para esta selección.</div>'}</div>`;
}
function csv(){
  const rows=filtered();const q=s=>`"${String(s??'').replace(/"/g,'""')}"`;
  const lines=[['Fecha','Empleado','PIN','Obra','Entrada','Salida','Horas','Zona entrada','Distancia entrada (m)','Horario entrada','Zona salida','Horario salida','Observación','Revisión'].join(';')];
  rows.slice().reverse().forEach(f=>{const e=empById(f.emp),o=obraById(f.obra);lines.push([dkey(f.in.t),e?.name,e?.pin?'••'+e.pin.slice(2):'',o?.name,hm(f.in.t),f.out?hm(f.out.t):'',f.out?((f.out.t-f.in.t)/36e5).toFixed(2).replace('.',','):'',ZONE[f.in.zone]?.[0],f.in.dist??'',schedLabel('in',f.in.sched)[0],f.out?ZONE[f.out.zone]?.[0]:'',f.out?schedLabel('out',f.out.sched)[0]:'',f.note,f.review?`${f.review.by}: ${f.review.note||'OK'}`:''].map(q).join(';'))});
  return '﻿'+lines.join('\r\n');
}
function offerFile(name,text,mime){
  try{const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}catch(e){}
}
function copyText(text,okMsg){
  const done=()=>toast(okMsg);
  try{navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,okMsg))}catch(e){fallbackCopy(text,okMsg)}
}
function fallbackCopy(text,okMsg){sheet('Copiar datos',`<p class="hint" style="margin:0">Selecciona el texto y cópialo.</p><textarea class="inp num" id="cp_t" rows="14" style="font-size:12px">${esc(text)}</textarea>`);const t=$('#cp_t');t.focus();t.select()}

/* ───────────── Asistencia ───────────── */
const CELL={trab:'Trabajado (con fichaje)',anot:'Trabajado (anotado por Sergio)',falta:'Falta confirmada',just:'Ausencia justificada',vac:'Vacaciones',rev:'Sin fichaje · revisar',fest:'Festivo',libre:'No laborable',pend:'Pendiente de jornada',none:'Fuera de alta'};
const NOTE_T={anot:'Trabajado (anotado por Sergio)',falta:'Falta confirmada',just:'Ausencia justificada',vac:'Vacaciones'};
function cellOf(e,d){
  const k=dkey(d),t0=new Date();t0.setHours(0,0,0,0);
  if(k<e.alta)return'none';
  const n=S.notes.filter(x=>x.emp===e.id&&x.date===k).slice(-1)[0];if(n)return n.type;
  if(fichOf(e.id,d).length)return'trab';
  const ex=especialFor(d);if(ex&&ex.type==='off')return'fest';
  if(!scheduleFor(d))return'libre';
  if(d>t0)return'pend';
  if(sameDay(d,t0))return'pend';
  return'rev';
}
function vAsistencia(){
  const now=new Date();const m=U.month||{y:now.getFullYear(),m:now.getMonth()};U.month=m;
  const days=new Date(m.y,m.m+1,0).getDate();const ds=[...Array(days)].map((_,i)=>new Date(m.y,m.m,i+1));
  const emps=S.emps.filter(e=>e.active||S.fich.some(f=>f.emp===e.id));
  const label=cap(new Date(m.y,m.m,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'}).replace(' de ',' '));
  const sum=e=>{const c={trab:0,falta:0,just:0,vac:0,rev:0};ds.forEach(d=>{const x=cellOf(e,d);if(x==='trab'||x==='anot')c.trab++;else if(c[x]!=null)c[x]++});return c};
  const missingAlta=S.emps.filter(e=>!e.alta);
  return `<div class="head"><div><h2>Asistencia mensual</h2><p>Toca un día para consultar los fichajes o anotar una ausencia. Cada cambio conserva su motivo y su historial.</p></div>
   <div class="row"><button class="iconbtn" data-mon="-1" aria-label="Mes anterior">${ic('left')}</button><b style="min-width:150px;text-align:center;font-family:var(--display);font-size:17px">${label}</b><button class="iconbtn" data-mon="1" aria-label="Mes siguiente">${ic('right')}</button></div></div>
  ${missingAlta.length?`<div class="demo" style="background:var(--amber-soft)">Falta la fecha de alta. Añádela en Equipo para detectar días sin fichaje desde esa fecha.</div>`:''}
  <div class="card pad">
   ${emps.length?`<div class="tablewrap"><table class="att"><thead><tr><th class="n">Empleado</th>${ds.map(d=>`<th class="${d.getDay()%6===0?'wk':''} ${sameDay(d,now)?'today':''}">${DOW[d.getDay()]}<br>${d.getDate()}</th>`).join('')}</tr></thead>
   <tbody>${emps.map(e=>`<tr><td class="n">${esc(e.name.split(' ')[0])} ${esc(e.name.split(' ')[1]?.[0]||'')}.</td>${ds.map(d=>{const c=cellOf(e,d);return `<td><button type="button" class="c ${c}" ${c==='none'?'disabled':''} data-cell="${e.id}|${dkey(d)}" title="${esc(e.name)} · ${fShort(d)} · ${CELL[c]}" aria-label="${esc(e.name)}, ${fShort(d)}: ${CELL[c]}">${c==='trab'?'':c==='falta'?'F':c==='just'?'J':c==='vac'?'V':c==='rev'?'?':c==='anot'?'A':''}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="legend">${['trab','anot','falta','just','vac','rev','fest','libre'].map(k=>`<span><i class="c ${k}"></i>${CELL[k]}</span>`).join('')}</div>`:'<div class="empty">Añade empleados y su fecha de alta en Equipo. Aquí aparecerán sus días trabajados y las faltas confirmadas.</div>'}
  </div>
  ${emps.length?`<div class="card tablewrap" style="margin-top:14px"><table><thead><tr><th>Empleado</th><th>Trabajados</th><th>Faltas</th><th>Justificadas</th><th>Vacaciones</th><th>Por revisar</th><th>Horas del mes</th></tr></thead><tbody>${emps.map(e=>{const c=sum(e);const h=S.fich.filter(f=>f.emp===e.id&&new Date(f.in.t).getMonth()===m.m&&new Date(f.in.t).getFullYear()===m.y).reduce((a,f)=>a+worked(f),0);return `<tr><td><b>${esc(e.name)}</b></td><td class="num">${c.trab}</td><td class="num" style="color:${c.falta?'var(--red)':''}">${c.falta}</td><td class="num">${c.just}</td><td class="num">${c.vac}</td><td class="num">${c.rev?`<span class="chip warn">${c.rev}</span>`:'0'}</td><td class="num">${hrs(h)} h</td></tr>`}).join('')}</tbody></table></div>`:''}
  <section class="card" style="margin-top:14px"><div class="pad" style="padding-bottom:4px"><h3 style="font-size:17px">Historial de anotaciones</h3></div><div class="list">${S.notes.length?S.notes.slice().sort((a,b)=>b.t-a.t).slice(0,12).map(n=>`<div class="li"><span class="c ${n.type}" style="width:12px;height:12px;border-radius:4px;display:inline-block"></span><div class="main"><div class="name">${esc(empById(n.emp)?.name||'—')} · ${fShort(fromKey(n.date))}</div><div class="sub">${esc(NOTE_T[n.type])} · “${esc(n.reason)}” · ${esc(n.by)}, ${fDT(n.t)}</div></div></div>`).join(''):'<div class="empty">Sin anotaciones todavía.</div>'}</div></section>`;
}
function cellSheet(empId,k){
  const e=empById(empId),d=fromKey(k),fs=fichOf(empId,d),c=cellOf(e,d);const t0=new Date();t0.setHours(0,0,0,0);
  const hist=S.notes.filter(n=>n.emp===empId&&n.date===k);
  sheet(`${e.name.split(' ')[0]} · ${fShort(d)}`,`
   <div class="row"><span class="c ${c}" style="width:18px;height:18px;border-radius:6px;display:inline-block"></span><b>${CELL[c]}</b></div>

   <form class="form" id="fNote" novalidate>

     <div class="field"><label for="n_reason">Motivo</label><textarea class="inp" id="n_reason" rows="3" placeholder="Observación breve, sin diagnósticos ni datos médicos"></textarea></div>
     <div class="err" id="n_err"></div>
     <button class="btn primary" type="submit">${ic('check')}Guardar anotación</button>
   </form>
   ${hist.length?`<div><div class="lbl" style="margin-bottom:6px">Historial de este día</div>${hist.map(n=>`<div class="small" style="padding:6px 0;border-top:1px solid var(--line)">${esc(NOTE_T[n.type]||'Anotación retirada')} · “${esc(n.reason)}” · ${esc(n.by)}, ${fDT(n.t)}</div>`).join('')}</div>`:''}`);
  $('#fNote').onsubmit=ev=>{ev.preventDefault();const type=$('#n_type').value,reason=$('#n_reason').value.trim();
    if(reason.length<5)return $('#n_err').textContent='Escribe el motivo de la anotación (al menos cinco caracteres).';
    if((type==='falta'||type==='anot')&&d>t0)return $('#n_err').textContent='No se pueden confirmar faltas o días trabajados futuros.';
    if(type==='falta'&&fs.length)return $('#n_err').textContent='Hay fichajes este día. Revísalos antes de confirmar una falta.';
    if(!type){S.notes=S.notes.filter(n=>!(n.emp===empId&&n.date===k));}
    else S.notes.push({id:uid(),emp:empId,date:k,type,reason,by:'Sergio',t:Date.now()});
    logA(`Asistencia ${e.name} ${k}: ${NOTE_T[type]||'según fichajes'}`);save();closeSheet();render();toast('Anotación guardada');};
}

     <div class="row"><div class="av" style="background:${avColor(e.id)}">${ini(e.name)}</div><div style="flex:1;min-width:0"><b>${esc(e.name)}</b><div class="small muted">${fDay(f.in.t)} · ${esc(o?.name||'')}</div></div>${f.review?'<span class="chip ok">Revisada</span>':'<span class="chip warn">Por revisar</span>'}</div>

/* ───────────── Ajustes ───────────── */
function vAjustes(){

/* Cifrado de copias: PBKDF2 (250 000 iteraciones) + AES-GCM */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encryptState(pw){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));const k=await deriveKey(pw,salt);const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify({app:'sgm-fichajes',at:Date.now(),data:S})));return `SGM1:${b64(salt)}:${b64(iv)}:${b64(ct)}`}
async function decryptState(txt,pw){const p=txt.trim().split(':');if(p[0]!=='SGM1'||p.length!==4)throw new Error('fmt');const k=await deriveKey(pw,ub64(p[1]));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(p[2])},k,ub64(p[3]));const o=JSON.parse(new TextDecoder().decode(pt));if(o.app!=='sgm-fichajes')throw new Error('app');return o}

  const punch={t:p.t,lat:p.lat,lng:p.lng,acc:p.acc,zone:p.zone,dist:p.dist,zObra:p.zObra,sched:p.sched,sim:!!p.sim};
  let f;
  if(K.kind==='in'){f={id:uid(),emp:e.id,obra:e.obra,in:punch,out:null,note,review:null,source:'app'};S.fich.push(f)}
  else{f=openToday(e.id);if(!f){toast('No hay una entrada abierta hoy',true);return}f.out=punch;if(note)f.note=f.note?f.note+' · Salida: '+note:note}
  save();notify(iss.length?`${e.name}: ${K.kind==='in'?'entrada':'salida'} con incidencia`:null,iss.join(' · '));
  U.K={step:'done',emp:e.id,kind:K.kind,done:f.id};render();kIdle();
  let s=9;const cd=setInterval(()=>{const el=$('#k_cd');if(!el||U.K.step!=='done'){clearInterval(cd);return}el.textContent=`(${--s})`;if(s<=0)clearInterval(cd)},1000);
}
function kFixSubmit(){
  const K=U.K;const e=empById(K.emp);
  const fid=$('#x_kind').value;const f=fid?S.fich.find(x=>x.id===fid):null;
  const date=f?dkey(f.in.t):$('#x_dt').value;const pin=$('#x_in').value,pout=$('#x_out').value,why=$('#x_why').value.trim();const err=$('#x_err2');
  if(!date||!pin)return err.textContent='Indica la fecha y la hora de entrada propuesta.';
  if(pout&&toMin(pout)<=toMin(pin))return err.textContent='La salida debe ser posterior a la entrada.';
  const tin=atTime(fromKey(date),pin),tout=pout?atTime(fromKey(date),pout):null;
  if(tin>Date.now()||(tout&&tout>Date.now()))return err.textContent='No puedes proponer horas futuras.';
  if(why.length<5)return err.textContent='Escribe un motivo de al menos cinco caracteres.';
  const clash=S.fich.some(x=>x.emp===e.id&&x.id!==fid&&sameDay(x.in.t,tin)&&x.in.t<(tout||tin+1)&&(x.out?x.out.t:Date.now())>tin);
  if(clash)return err.textContent='La propuesta se cruza con otra jornada.';
  S.reqs.push({id:uid(),emp:e.id,kind:f?'fix':'forgot',fich:fid||null,date,pin,pout,reason:why,t:Date.now(),state:'pending'});
  save();notify(`${e.name} solicita una corrección`,why);toast('Solicitud registrada. Sergio debe revisarla.');
  U.K={step:'home',emp:e.id,pin:''};render();kIdle();
}

/* ───────────── Avisos ───────────── */
function notify(title,body){if(!title||!S.cfg.push)return;try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body,icon:$('.logo img').src})}catch(e){}}
async function enablePush(){
  try{
    if(!('Notification' in window))throw 0;
    const r=await Notification.requestPermission();
    if(r!=='granted')throw 0;
    S.cfg.push=true;save();new Notification('SGM · Avisos activados',{body:'Recibirás avisos de fichajes con incidencia y correcciones.',icon:$('.logo img').src});toast('Avisos activados en este dispositivo');render();
  }catch(e){toast('Este navegador no permite avisos aquí. Instala la app en el móvil para recibirlos.',true)}
}

/* ───────────── Panel lateral ───────────── */
let lastFocus=null;
function sheet(title,body){lastFocus=document.activeElement;$('#layer').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="iconbtn" type="button" id="closeSheet" aria-label="Cerrar">${ic('x')}</button></header><div class="body">${body}</div></div></div>`;
  $('#scrim').addEventListener('click',e=>{if(e.target.id==='scrim')closeSheet()});$('#closeSheet').onclick=closeSheet;setTimeout(()=>{const f=$('.sheet input,.sheet select,.sheet textarea');f&&f.focus()},60)}
function closeSheet(){$('#layer').innerHTML='';lastFocus&&lastFocus.focus&&lastFocus.focus()}
function confirmIn(btn,label,fn){if(btn.dataset.arm){fn();return}btn.dataset.arm='1';const o=btn.innerHTML;btn.innerHTML='Pulsa otra vez para confirmar';btn.classList.add('primary');setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.innerHTML=o;btn.classList.remove('primary')}},3500)}

/* ───────────── Eventos ───────────── */
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('button,[data-go]');if(!b)return;const d=b.dataset;
  if(d.tab)return go(d.tab);
  if(d.go)return go(d.go);
  if(d.k)return kPress(d.k);
  if(d.kx){const K=U.K;
    if(d.kx==='exit'){kReset();render();return}
    if(d.kx==='in'||d.kx==='out')return kStart(d.kx);
    if(d.kx==='commit')return kCommit();
    if(d.kx==='back'||d.kx==='home'){U.K={step:'home',emp:K.emp,pin:''};render();kIdle();return}
  }
  if(d.ksim)return kSim(d.ksim);
  if(d.kfix!=null){U.K={step:'fix',emp:U.K.emp,fixFich:d.kfix||null,pin:''};render();kIdle();
    bindFix();return}
  if(d.per){U.filt.period=d.per;return render()}
  if(d.mon){const m=U.month;let mm=m.m+(+d.mon),yy=m.y;if(mm<0){mm=11;yy--}if(mm>11){mm=0;yy++}U.month={y:yy,m:mm};return render()}
  if(d.cell){const [id,k]=d.cell.split('|');return cellSheet(id,k)}
  if(d.season){S.cfg.season=d.season;logA(`Temporada activa: ${d.season}`);save();render();return toast(`Horario de ${d.season} activado`)}
  if(d.delx){S.cfg.especiales=S.cfg.especiales.filter(x=>x.id!==d.delx);save();return render()}
  if(d.xt){$$('[data-xt]').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#x_times').hidden=d.xt!=='special';return}
  if(d.rev){const f=S.fich.find(x=>x.id===d.rev);f.review={state:'ok',by:'Sergio',note:($('#fn_'+f.id)?.value||'').trim(),t:Date.now()};logA(`Incidencia revisada: ${empById(f.emp).name} ${dkey(f.in.t)}`);save();render();return toast('Revisión guardada')}
  if(d.fix){const f=S.fich.find(x=>x.id===d.fix);const v=$('#fo_'+f.id).value;if(!v)return toast('Indica la hora de salida real',true);const t=atTime(f.in.t,v);if(t<=f.in.t)return toast('La salida debe seguir a la entrada',true);f.out={t,zone:'na',sched:schedCheck('out',t),manual:true};f.review={state:'ok',by:'Sergio',note:`Salida anotada por Sergio a las ${v}. ${($('#fn_'+f.id)?.value||'').trim()}`.trim(),t:Date.now()};save();render();return toast('Salida registrada y revisada')}
  if(d.req){const r=S.reqs.find(x=>x.id===d.id);r.reviewNote=($('#rn_'+r.id)?.value||'').trim();r.reviewedAt=Date.now();
    if(d.req==='ok'){r.state='approved';const day=fromKey(r.date);const tin=atTime(day,r.pin),tout=r.pout?atTime(day,r.pout):null;
      if(r.fich){const f=S.fich.find(x=>x.id===r.fich);if(f){f.orig={in:f.in.t,out:f.out?.t??null};f.in={...f.in,t:tin,sched:schedCheck('in',tin)};if(tout)f.out={...(f.out||{zone:'na'}),t:tout,sched:schedCheck('out',tout)};f.review={state:'ok',by:'Sergio',note:'Corrección aprobada'+(r.reviewNote?' · '+r.reviewNote:''),t:Date.now()};f.source='correccion'}}
      else S.fich.push({id:uid(),emp:r.emp,obra:empById(r.emp).obra,in:{t:tin,zone:'na',sched:schedCheck('in',tin)},out:tout?{t:tout,zone:'na',sched:schedCheck('out',tout)}:null,note:r.reason,review:{state:'ok',by:'Sergio',note:'Corrección aprobada',t:Date.now()},source:'correccion'});
      toast('Corrección aprobada')}else{r.state='rejected';toast('Corrección rechazada')}
    logA(`Corrección ${r.state==='approved'?'aprobada':'rechazada'}: ${empById(r.emp).name} ${r.date}`);save();return render()}
  switch(d.act){
    case 'newObra':return obraForm();
    case 'editObra':return obraForm(obraById(d.id));
    case 'newEmp':return empForm();
    case 'editEmp':return empForm(empById(d.id));
    case 'clearF':U.filt.emp='';U.filt.obra='';return render();
    case 'csv':{const t=csv();offerFile(`sgm-registro-jornada-${dkey(new Date())}.csv`,t,'text/csv;charset=utf-8');return copyText(t,'CSV preparado y copiado al portapapeles')}
    case 'push':return enablePush();
    case 'pushOff':S.cfg.push=false;save();render();return toast('Avisos desactivados');
    case 'saveMail':{const v=$('#a_mail').value.trim();if(!/^\S+@\S+\.\S+$/.test(v))return toast('Escribe un correo válido',true);S.cfg.sergioEmail=v;logA('Accesos actualizados');save();return toast('Accesos guardados')}
    case 'saveH':{const err=$('#h_err');const nx={};for(const k of ['invierno','verano']){const s=$(`#h_${k}_s`).value,e=$(`#h_${k}_e`).value,m=+$(`#h_${k}_m`).value,days=$$(`[data-day="${k}"]:checked`).map(x=>+x.value);
        if(!s||!e)return err.textContent='Revisa los horarios.';if(toMin(e)<=toMin(s))return err.textContent='La salida debe ser posterior a la entrada.';if(!(m>=0&&m<=60))return err.textContent='El margen debe estar entre 0 y 60 minutos.';if(!days.length)return err.textContent='Selecciona los días de trabajo.';nx[k]={start:s,end:e,margin:m,days}}
      S.cfg.seasons=nx;logA('Horarios actualizados');save();render();return toast('Horarios guardados')}
    case 'addX':{const date=$('#x_date').value,label=$('#x_label').value.trim(),sp=$('[data-xt="special"]').getAttribute('aria-pressed')==='true';const err=$('#x_err');
      if(!date||!label)return err.textContent='Indica la fecha y el nombre del día.';
      const x={id:uid(),date,label,type:sp?'special':'off'};if(sp){x.start=$('#x_s').value;x.end=$('#x_e').value;if(toMin(x.end)<=toMin(x.start))return err.textContent='La salida debe ser posterior a la entrada.'}
      S.cfg.especiales=S.cfg.especiales.filter(y=>y.date!==date).concat(x);logA(`Día especial: ${label}`);save();render();return toast('Día especial guardado')}
    case 'backup':{const pw=$('#b_pw').value;if(pw.length<12){$('#b_msg').textContent='Usa una contraseña de al menos 12 caracteres y consérvala para recuperar la copia.';return}
      $('#b_msg').textContent='Cifrando…';try{const t=await encryptState(pw);offerFile(`sgm-copia-${dkey(new Date())}.sgm`,t,'application/octet-stream');$('#b_msg').innerHTML=`Copia cifrada preparada (${Math.round(t.length/1024)} KB). Si la descarga no empieza, <button class="linkbtn" id="b_copy" type="button">copia el texto de la copia</button> y guárdalo en un archivo.`;$('#b_copy').onclick=()=>copyText(t,'Copia cifrada copiada');logA('Copia cifrada descargada');save()}catch(e){$('#b_msg').textContent='No se ha podido completar el cifrado en este navegador.'}return}
    case 'verify':{const msg=$('#r_msg');let txt=$('#r_txt').value.trim();const fl=$('#r_file').files[0];if(!txt&&fl)txt=await fl.text();if(!txt){msg.textContent='Selecciona una copia cifrada de SGM.';return}
      msg.textContent='Comprobando…';try{const o=await decryptState(txt,$('#r_pw').value);verified=o.data;msg.textContent=`Copia válida del ${fDT(o.at)}: ${o.data.obras.length} obras, ${o.data.emps.length} empleados, ${o.data.fich.length} fichajes. Se sustituirán los datos actuales. Descarga antes una copia del estado actual.`;$('#r_go').hidden=false}catch(e){verified=null;$('#r_go').hidden=true;msg.textContent='La contraseña no es correcta o la copia está dañada.'}return}
    case 'restore':{if(!verified)return;return confirmIn(b,'',()=>{S=verified;verified=null;S.mode='admin';logA('Copia restaurada');save();render();toast('Copia restaurada')})}
  }
});
document.addEventListener('change',ev=>{const t=ev.target;
  if(t.id==='fl_emp'){U.filt.emp=t.value;render()}
  if(t.id==='fl_obra'){U.filt.obra=t.value;render()}
  if(t.id==='showRev'){U.showReviewed=t.checked;render()}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&$('#scrim')){closeSheet();return}
  if(U.tab!=='fichar'||U.K.step!=='pin'||$('#scrim'))return;
  if(/^\d$/.test(ev.key))kPress(ev.key);else if(ev.key==='Backspace')kPress('del');else if(ev.key==='Enter')kPress('ok');
});
['pointerdown','keydown'].forEach(t=>document.addEventListener(t,()=>{if(U.tab==='fichar'&&U.K.step!=='pin'&&U.K.step!=='done')kIdle()},{passive:true}));
$('#modeBtn').onclick=()=>{
  if(S.mode==='admin'){S.mode='kiosk';kReset();save();go('fichar');toast('Modo tablet de obra: solo fichajes')}
  else{const b=$('#modeBtn');confirmIn(b,'',()=>{S.mode='admin';save();go('resumen');toast('Acceso de Sergio')})}
};
$('#resetDemo').onclick=e=>confirmIn(e.target,'',()=>{try{localStorage.removeItem(KEY)}catch(err){}seed();save();kReset();U.month=null;go('resumen');toast('Demo reiniciada con datos de ejemplo')});

/* ───────────── Tema claro / oscuro ───────────── */
const TKEY='sgm-fichajes-tema';
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){const d=isDark();$('#themeBtn').innerHTML=ic(d?'sun':'moon')+`<span>${d?'Modo claro':'Modo oscuro'}</span>`;$('#themeBtn').setAttribute('aria-label',d?'Cambiar a modo claro':'Cambiar a modo oscuro')}
try{const t=localStorage.getItem(TKEY);if(t==='dark'||t==='light')document.documentElement.dataset.theme=t}catch(e){}
$('#themeBtn').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t)}catch(e){}paintTheme()};
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme)}catch(e){}
paintTheme();

/* ───────────── Reloj ───────────── */
function tick(){
  const n=new Date();$('#clk').textContent=`${pad(n.getHours())}:${pad(n.getMinutes())}:${pad(n.getSeconds())}`;
  $('#clkd').textContent=fDay(n);
  $$('[data-since]').forEach(el=>{el.textContent=durS(n-(+el.dataset.since))});
}
setInterval(tick,1000);

S=load();
if(!S||S.v!==2){seed();save()}
const h=(location.hash||'').slice(1);
U.tab=TABS.some(t=>t[0]===h)?h:(S.mode==='kiosk'?'fichar':'resumen');
