<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>SGM Presupuestos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SGM">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Presupuestos, facturas, clientes y obras de Construcciones SGM.">

<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#14261a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" async></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" async></script>
<style>
/* Layout: cuaderno de obra — barra lateral blanca con el logo, área de trabajo verdosa, total siempre visible como un ticket */
:root{
  --bg:#f2f5f0; --surface:#ffffff; --surface-2:#f7f9f5; --ink:#192028; --muted:#5b675e; --faint:#8a958c;
  --line:#dfe6dc; --line-strong:#c9d4c5;
  --brand:#14741a; --brand-strong:#0d5a12; --brand-ink:#ffffff; --brand-soft:#e5f1e2; --forest:#14261a; --forest-ink:#eef4ec;
  --warn:#9a5b00; --warn-soft:#fbefd9; --danger:#b3261e; --danger-soft:#fbe4e1; --info:#245a86; --info-soft:#e2edf7;
  --ok:#14741a; --ok-soft:#e5f1e2;
  --plate:#ffffff; --veil:rgba(250,252,249,.94); --veil-soft:rgba(250,252,249,.55);
  --shadow:0 1px 2px rgba(20,38,26,.06),0 8px 24px rgba(20,38,26,.06);
  --f-display:'Archivo','Arial Narrow',system-ui,sans-serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1310; --surface:#161d18; --surface-2:#1b241d; --ink:#e6ede4; --muted:#a3b0a5; --faint:#7d897f;
  --line:#28332a; --line-strong:#36443a;
  --brand:#4fae55; --brand-strong:#6cc472; --brand-ink:#0b1a0d; --brand-soft:#1c2e1f; --forest:#0b170e; --forest-ink:#e6efe4;
  --warn:#e2a54b; --warn-soft:#2e2414; --danger:#ef8077; --danger-soft:#33191a; --info:#7db3e0; --info-soft:#14222f;
  --ok:#6cc472; --ok-soft:#1c2e1f; --plate:#f4f7f2; --veil:rgba(14,19,16,.92); --veil-soft:rgba(14,19,16,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1310; --surface:#161d18; --surface-2:#1b241d; --ink:#e6ede4; --muted:#a3b0a5; --faint:#7d897f;
  --line:#28332a; --line-strong:#36443a;
  --brand:#4fae55; --brand-strong:#6cc472; --brand-ink:#0b1a0d; --brand-soft:#1c2e1f; --forest:#0b170e; --forest-ink:#e6efe4;
  --warn:#e2a54b; --warn-soft:#2e2414; --danger:#ef8077; --danger-soft:#33191a; --info:#7db3e0; --info-soft:#14222f;
  --ok:#6cc472; --ok-soft:#1c2e1f; --plate:#f4f7f2; --veil:rgba(14,19,16,.92); --veil-soft:rgba(14,19,16,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:108%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num,.money{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;background:var(--surface);border-right:1px solid var(--line);padding:22px 16px 18px}
.side-logo{background:var(--plate);border-radius:var(--r);padding:12px 14px 8px;display:block}
.side-logo img{display:block;width:100%;height:auto}
.side-sub{font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-top:-6px}
.btn-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:var(--r);background:var(--brand);color:var(--brand-ink);padding:13px 14px;font-weight:700;font-size:15px}
.btn-new:hover{background:var(--brand-strong)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;border-radius:10px;padding:10px 12px;text-align:left;color:var(--muted);font-weight:600}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong)}
.nav .count{margin-left:auto;font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:20px;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--muted)}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:var(--forest-ink);font-family:var(--f-display);font-weight:700}
.user b{display:block;color:var(--ink);font-size:14px}
.demo-tag{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:4px 8px;font-weight:600;line-height:1.35}

.topbar{display:none}
.main{min-width:0;padding-block:28px 120px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.tabbar{display:none}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.head h1{font-size:clamp(26px,3vw,34px);font-weight:800;margin-top:4px}
.head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.head-actions{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- Basics ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand-strong)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font-size:18px;font-weight:700}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.field{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.input{width:100%;min-height:46px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px;font-weight:500;color:var(--ink)}
.field textarea{min-height:110px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus,.input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Borrador{background:var(--surface-2);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.st-Enviado{background:var(--info-soft);color:var(--info)}
.st-Aceptado,.st-Cobrada,.st-Terminada{background:var(--ok-soft);color:var(--ok)}
.st-Rechazado,.st-Vencida{background:var(--danger-soft);color:var(--danger)}
.st-Pendiente,.st-En\ curso{background:var(--warn-soft);color:var(--warn)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.chip .n{opacity:.7;margin-left:4px}
.search{position:relative}
.search .ic{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--faint)}
.search input{padding-left:40px}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- Dashboard ---------- */
.hero{position:relative;overflow:hidden;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:28px;align-items:center;min-height:300px}
.hero>*:not(.kv){position:relative;z-index:1}
.hero h1{font-size:clamp(26px,2.5vw,34px);font-weight:800;line-height:1.08;margin:8px 0 10px}
.hero p{margin:0;color:var(--muted);max-width:42ch}
.tpls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tpl{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);border-radius:12px;padding:14px;min-height:84px;transition:border-color .15s,transform .15s,box-shadow .15s}
.tpl:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
.tpl b{font-family:var(--f-display);font-size:16px;font-stretch:108%}
.tpl span{font-size:12px;color:var(--muted)}
.tpl.blank{border-style:dashed}
/* Imagen de portada (6 propuestas) */
.kv{position:absolute;inset:0;z-index:0;overflow:hidden;background:var(--surface)}
.kv-img{position:absolute;inset:0;background-size:cover;background-position:center}
.kv-veil{position:absolute;inset:0;background:linear-gradient(90deg,var(--veil) 0%,var(--veil) 36%,var(--veil-soft) 62%,transparent 100%)}
.kv-oficio .kv-img{background-position:70% 40%}
.kv-arquitectura .kv-img{background-position:center 55%}
.kv-plano .kv-img{background-position:center 30%;filter:grayscale(1) contrast(1.05) brightness(1.06)}
.kv-plano .kv-veil{background:linear-gradient(90deg,var(--veil) 0%,var(--veil) 38%,color-mix(in srgb,var(--brand) 22%,transparent) 100%)}
.kv-interior .kv-img{background-position:center 60%}
.kv-emblema{background:radial-gradient(120% 140% at 100% 0%,color-mix(in srgb,var(--brand) 16%,var(--surface)) 0%,var(--surface) 60%)}
.kv-emblema .kv-stripes{position:absolute;right:-6%;top:-20%;bottom:-20%;width:58%;background:repeating-linear-gradient(135deg,transparent 0 34px,color-mix(in srgb,var(--brand) 9%,transparent) 34px 64px)}
.kv-emblema .kv-mark{position:absolute;right:4%;bottom:-6%;width:46%;max-width:520px;opacity:.12}
.kv-dibujo{background-color:var(--surface-2);background-image:linear-gradient(color-mix(in srgb,var(--brand) 9%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--brand) 9%,transparent) 1px,transparent 1px);background-size:24px 24px}
.kv-draw{position:absolute;right:2%;bottom:0;height:96%;width:auto;max-width:62%;color:var(--brand);opacity:.55}
.kv-draw text{fill:currentColor;stroke:none;font:600 13px var(--f-display)}
.kv-pick{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.kv-pick b{font-weight:700;color:var(--ink);margin-right:4px}
.kv-pick button{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.kv-pick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
/* Acceso */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);background:var(--surface)}
.login-visual{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:40px;min-height:320px}
.login-visual .kv-veil{background:linear-gradient(0deg,var(--veil) 0%,var(--veil) 24%,var(--veil-soft) 46%,transparent 72%)}
.login-visual .kv-plano .kv-veil{background:linear-gradient(0deg,var(--veil) 0%,color-mix(in srgb,var(--brand) 18%,transparent) 70%)}
.login-cap{position:relative;z-index:1;display:grid;gap:6px;max-width:460px}
.login-cap h2{font-size:clamp(28px,3.3vw,44px);font-weight:800;line-height:1.05;color:var(--ink);text-shadow:0 1px 18px var(--veil),0 0 2px var(--veil)}
.login-cap .eyebrow{color:var(--brand-strong);font-size:13px;text-shadow:0 0 10px var(--veil)}
.login-cap p{margin:0;color:var(--ink);font-weight:600;font-size:16px;text-shadow:0 0 10px var(--veil)}
.login-panel{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-box{width:100%;max-width:380px;margin:0 auto;display:grid;gap:16px}
.login-box .lg{background:var(--plate);border-radius:14px;padding:10px;width:180px;justify-self:center}
.login-box .lg img{display:block;width:100%;height:auto}
.login-box h1{font-size:28px;font-weight:800;text-align:center}
.login-box .sub{text-align:center;color:var(--muted);margin:-8px 0 4px}
.login-box .btn{min-height:50px;font-size:16px}
.login-foot{max-width:380px;margin:0 auto;width:100%;display:grid;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:4px;text-align:left}
button.kpi:hover{border-color:var(--line-strong)}
.kpi .k-label{font-size:13px;color:var(--muted);font-weight:600}
.kpi .k-val{font-family:var(--f-display);font-size:26px;font-weight:800;font-stretch:104%;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .k-sub{font-size:12px;color:var(--faint)}
.kpi.warn .k-val{color:var(--warn)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.todo{display:grid}
.todo-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo-item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%}
.dot.warn{background:var(--warn)} .dot.danger{background:var(--danger)} .dot.info{background:var(--info)} .dot.muted{background:var(--faint)}
.todo-item b{display:block;font-weight:600}
.todo-item span{font-size:13px;color:var(--muted)}

/* ---------- Lists ---------- */
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto auto auto;gap:16px;align-items:center;padding:14px 4px;border-top:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit}
.li:first-child{border-top:0}
.li:hover{background:var(--surface-2)}
.li .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .amt{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;text-align:right;min-width:110px}
.li .date{font-size:13px;color:var(--muted);white-space:nowrap}
.cols .li{grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}.cols .li .date,.cols .li .act{display:none}.cols .li .c2{grid-column:1;grid-row:2}.cols .li .pill{grid-column:2;grid-row:2;justify-self:end}.cols .li .amt{grid-column:2;grid-row:1;min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;text-align:left;color:inherit;align-content:start}
button.card:hover{border-color:var(--line-strong);box-shadow:var(--shadow)}
.card h3{font-size:17px;font-weight:700}
.card .meta{display:grid;gap:3px;font-size:13px;color:var(--muted)}
.card .stats{display:flex;gap:16px;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.card .stats b{display:block;color:var(--ink);font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:8px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-spent{background:var(--warn)} .bar .b-margin{background:var(--brand)}

/* ---------- Editor ---------- */
.steps{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px}
.step{flex:1;display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:10px 12px;color:var(--muted);font-weight:600;text-align:left;min-width:0}
.step .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);font-family:var(--f-display);font-weight:700;font-size:14px}
.step[aria-current="step"]{background:var(--brand-soft);color:var(--brand-strong)}
.step[aria-current="step"] .n{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.step.done .n{border-color:var(--brand);color:var(--brand)}
.step small{display:block;font-weight:500;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step span{min-width:0}
.client-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.cp{display:grid;gap:2px;text-align:left;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:10px 12px}
.cp:hover{border-color:var(--brand)}
.cp b{font-weight:600}
.cp span{font-size:12px;color:var(--muted)}
.chosen{display:flex;align-items:center;gap:14px;border:1.5px solid var(--brand);background:var(--brand-soft);border-radius:12px;padding:14px 16px}
.chosen .avatar{background:var(--brand);color:var(--brand-ink);flex:none}

function eur(n){n=r2(n);const neg=n<0;const [i,d]=Math.abs(n).toFixed(2).split('.');return (neg?'−':'')+group(i)+','+d+' €'}

function calc(d){
  const caps=[],map={};
  for(const l of d.lines){const k=l.cap||'otr';if(!map[k]){map[k]={id:k,name:capName(k),lines:[],sub:0};caps.push(map[k])}map[k].lines.push(l);map[k].sub=r2(map[k].sub+r2(l.qty*l.price))}
  caps.sort((a,b)=>CAP_ORDER.indexOf(a.id)-CAP_ORDER.indexOf(b.id));
  const base=r2(caps.reduce((s,c)=>s+c.sub,0)),disc=r2(base*(+d.discount||0)/100),net=r2(base-disc),iva=r2(net*(+d.iva||0)/100);
  return {caps,base,disc,net,iva,total:r2(net+iva)};
}

function dlg(html,wide=false){const d=$('#dlg');d.className=wide?'wide':'';d.innerHTML=`<div class="dlg">${html}</div>`;if(!d.open)d.showModal();fitPapers();return d}
const closeDlg=()=>{const d=$('#dlg');if(d?.open)d.close()};
function confirmBox(title,text,yes,fn,danger=true){dlg(`<div class="dlg-head"><h2>${esc(title)}</h2></div><div class="dlg-body"><p style="margin:0">${esc(text)}</p></div><div class="dlg-foot"><button class="btn" data-act="closeDlg">Cancelar</button><button class="btn ${danger?'danger':'primary'}" data-act="confirmYes">${esc(yes)}</button></div>`);S.onYes=fn}
function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=ic('check')+esc(msg);document.body.append(t);setTimeout(()=>t.remove(),2800)}

function waText(q,mode){const c=client(q.client),t=calc(q),name=(c?.name||'').split(' ')[0];
  if(mode==='follow')return `Hola ${name}, ¿qué tal? Soy Sergio, de Construcciones SGM. Te escribo por el presupuesto ${q.number} de «${q.title}» que te envié. ¿Has podido verlo? Si quieres ajustamos algo o pasamos a verlo en persona.\n\nUn saludo.`;
  return `Hola ${name}, soy Sergio, de Construcciones SGM.\n\nTe envío el presupuesto ${q.number||''} de «${q.title}».\nTotal: ${eur(t.total)} (IVA incluido).\nVálido hasta el ${dLong(addDays(q.date,+q.validity||30))}.\n\nCualquier duda me dices. Un saludo.`}
function openWhatsApp(id,mode){
  const q=S.ed&&S.ed.q.id===id?S.ed.q:db.quotes.find(q=>q.id===id);if(!q)return;

  <div class="dlg-foot"><button class="btn" data-act="copyWa">${ic('copy')} Copiar mensaje</button>${phone?`<a class="btn wa" href="https://wa.me/${phone}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${ic('chat')} Abrir WhatsApp</a>`:''}${mode==='follow'?'':`<button class="btn primary" data-act="markSent" data-id="${q.id}">${ic('check')} Marcar como enviado</button>`}</div>`);

function invoicePick(){const acc=db.quotes.filter(q=>q.status==='Aceptado');
  dlg(`<div class="dlg-head"><h2>Nueva factura</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div><div class="dlg-body"><p class="muted" style="margin:0">Elige el presupuesto aceptado que vas a facturar.</p>${acc.map(q=>`<button class="cp" data-act="invoiceFrom" data-id="${q.id}"><b>${esc(q.number)} · ${esc(q.title)}</b><span>${esc(client(q.client)?.name||'')} · ${eur(calc(q).total)}</span></button>`).join('')||'<div class="empty"><b>No hay presupuestos aceptados</b>Marca un presupuesto como aceptado para poder facturarlo.</div>'}</div>`)}
function invoiceFrom(id){const q=db.quotes.find(q=>q.id===id)||(S.ed&&S.ed.q);if(!q)return;const t=calc(q),done=db.invoices.filter(f=>f.quote===q.id).reduce((s,f)=>s+calc(f).net,0);const left=r2(t.net-done);
  dlg(`<div class="dlg-head"><h2>Facturar ${esc(q.number)}</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="dlg-body"><p style="margin:0"><b>${esc(q.title)}</b><br><span class="muted">Base presupuestada ${eur(t.net)} · ya facturado ${eur(done)} · queda ${eur(left)}</span></p>
   <div class="stack" style="gap:8px">${[['full','Todo lo que queda',left],['30','Anticipo del 30 %',r2(t.net*.3)],['40','Pago del 40 % durante la obra',r2(t.net*.4)]].map(([k,l,a],i)=>`<label class="cp" style="grid-template-columns:auto 1fr auto;display:grid;align-items:center;gap:10px"><input type="radio" name="inv-kind" id="ik-${k}" value="${k}" ${i===0?'checked':''} style="width:20px;height:20px;accent-color:var(--brand)"><b>${l}</b><span class="num">${eur(a)} + IVA</span></label>`).join('')}</div>
  </div><div class="dlg-foot"><button class="btn" data-act="closeDlg">Cancelar</button><button class="btn primary" data-act="createInvoice" data-id="${q.id}">${ic('receipt')} Crear factura</button></div>`)}
function createInvoice(id){const q=db.quotes.find(q=>q.id===id);if(!q)return;const k=($('input[name="inv-kind"]:checked')||{}).value||'full';const t=calc(q);const done=db.invoices.filter(f=>f.quote===q.id).reduce((s,f)=>s+calc(f).net,0);
  const d=today();const f={id:uid(),number:nextNumber('FAC',db.invoices,d),date:d,due:addDays(d,+db.company.dueDays||15),client:q.client,work:q.work,quote:q.id,iva:q.iva,discount:0,status:'Pendiente',payMethod:q.payMethod||'',lines:[]};
  const note='Presupuesto '+q.number+' · '+q.title;
  if(k==='full'&&done===0){f.lines=q.lines.map(l=>({...l,id:uid()}));f.discount=q.discount;f.lines.forEach(l=>l.note='');f.lines[0].note=note}
  else{const amt=k==='full'?r2(t.net-done):r2(t.net*(+k)/100);f.lines=[{id:uid(),cap:'otr',name:k==='full'?'Liquidación final de los trabajos':k==='30'?'Anticipo del 30 % a la aceptación':'Pago del 40 % durante la obra',unit:'ud',qty:1,price:amt,scope:'',note}]}
  db.invoices.push(f);save();closeDlg();S.view='facturas';S.ed=null;render();openInvoice(f.id);toast('Factura '+f.number+' creada')}

  dlg(`<div class="dlg-head"><h2>${id?esc(w.name):'Nueva obra'}</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div>

function parseText(txt){
  const out=[];const segs=txt.toLowerCase().replace(/\s+y\s+/g,', ').split(/[,;\n.]+(?!\d)/).map(s=>s.trim()).filter(Boolean);
  for(const seg of segs){const r=RULES.find(([re])=>re.test(seg));if(!r)continue;const name=r[1];const info=itemInfo(name);
    const mu=[...seg.matchAll(/(\d+(?:[.,]\d+)?)\s*(m2|m²|metros?|ml|uds?|unidades|puntos?|horas)\b/g)];const m=mu.length?mu[mu.length-1]:seg.match(/(\d+(?:[.,]\d+)?)/);
    let qty=m?parseNum(m[1]):1;if(!qty)qty=1;
    const ex=out.find(o=>o.name===name);if(ex){ex.qty+=qty;continue}
    out.push({name,qty,unit:info?.unit||'ud',src:seg,on:true})}
  return out;
}

async function addDocPages(pdf,d,kind,firstDoc){
  const holder=document.createElement('div');holder.style.cssText='position:fixed;left:-12000px;top:0;width:794px;background:#fff';holder.innerHTML=docHTML(d,kind);document.body.append(holder);
  const paper=holder.firstElementChild;paper.style.boxShadow='none';paper.style.zoom='1';
  try{
    const sc=2,canvas=await window.html2canvas(paper,{scale:sc,backgroundColor:'#ffffff',logging:false});
    const top=paper.getBoundingClientRect().top;const cands=[...paper.querySelectorAll('tr,section,header')].map(e=>e.getBoundingClientRect().bottom-top).sort((a,b)=>a-b);
    const H=paper.offsetHeight,PH=1123,TP=44,BP=40,pages=[];let y=0;
    while(y<H-4){const first=!pages.length;const avail=PH-(first?0:TP)-BP;let end=y+avail;if(end<H){const c=cands.filter(v=>v>y+80&&v<=end);if(c.length)end=c[c.length-1]}else end=H;pages.push([y,end,first]);y=end}
    const W=pdf.internal.pageSize.getWidth(),Hh=pdf.internal.pageSize.getHeight();
    pages.forEach(([a,b,first],i)=>{const pc=document.createElement('canvas');pc.width=794*sc;pc.height=PH*sc;const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pc.width,pc.height);
      g.drawImage(canvas,0,a*sc,794*sc,(b-a)*sc,0,(first?0:TP)*sc,794*sc,(b-a)*sc);
      if(pages.length>1){g.fillStyle='#7b877e';g.font=`${10*sc}px sans-serif`;g.textAlign='right';g.fillText(`${d.number||''} · Página ${i+1} de ${pages.length}`,(794-56)*sc,(PH-18)*sc)}
      if(!(firstDoc&&i===0))pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',0,0,W,Hh)});
  }finally{holder.remove()}
}
async function buildPDF(docs,name){
  if(!window.html2canvas||!window.jspdf){toast('Preparando el generador de PDF. Vuelve a pulsar en unos segundos.');return null}
  toast('Generando PDF…');
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4'});
    for(let i=0;i<docs.length;i++)await addDocPages(pdf,docs[i].d,docs[i].kind,i===0);
    return {blob:pdf.output('blob'),name:name||pdfName(docs[0].d,docs[0].kind)};
  }catch(e){toast('No se ha podido generar el PDF');return null}
}

function normPhone(p){let d=String(p||'').replace(/[^\d+]/g,'');if(d.startsWith('00'))d='+'+d.slice(2);if(/^[6789]\d{8}$/.test(d))d='+34'+d;return d}
const waNum=p=>normPhone(p).replace(/\D/g,'');

function parseVCF(txt){const out=[];let cur=null;
  for(const L of String(txt).replace(/\r\n/g,'\n').replace(/\n[ \t]/g,'').split('\n')){const u=L.toUpperCase();
    if(u.startsWith('BEGIN:VCARD')){cur={name:'',phones:[],emails:[]};continue}
    if(u.startsWith('END:VCARD')){if(cur&&(cur.name||cur.phones.length))out.push(cur);cur=null;continue}
    if(!cur)continue;const i=L.indexOf(':');if(i<0)continue;
    const k=L.slice(0,i).toUpperCase().split(';')[0].split('.').pop(),val=L.slice(i+1).replace(/\\([,;\\nN])/g,(m,c)=>/n/i.test(c)?' ':c).trim();
    if(k==='FN')cur.name=val;else if(k==='N'&&!cur.name){const p=val.split(';');cur.name=[p[1],p[0]].filter(Boolean).join(' ')}else if(k==='TEL')cur.phones.push(val);else if(k==='EMAIL')cur.emails.push(val)}
  return out}
function mergeContacts(list){let add=0;
  for(const c of list){const phone=normPhone((c.phones||[])[0]||''),name=String(c.name||'').trim()||phone;if(!name)continue;
    const ex=db.contacts.find(x=>(phone&&normPhone(x.phone)===phone)||x.name.toLowerCase()===name.toLowerCase());
    if(ex){if(!ex.phone&&phone)ex.phone=phone;if(!ex.email&&(c.emails||[])[0])ex.email=c.emails[0];continue}
    db.contacts.push({id:uid(),name,phone,email:(c.emails||[])[0]||''});add++}
  save();return add}

  const ph=new Set(cl.map(c=>normPhone(c.phone)).filter(Boolean));

  return [...cl,...ag].filter(p=>!s||(p.name+' '+p.phone+' '+p.email).toLowerCase().includes(s)).sort((a,b)=>a.name.localeCompare(b.name,'es'))}

/* ---------- Enviar presupuesto o factura ---------- */
function sendDoc(){const x=S.send;if(!x)return null;if(x.kind==='quote')return S.ed&&S.ed.q.id===x.id?S.ed.q:db.quotes.find(q=>q.id===x.id);return db.invoices.find(f=>f.id===x.id)}
function openSend(kind,id){const d=kind==='quote'?(S.ed&&S.ed.q.id===id?S.ed.q:db.quotes.find(q=>q.id===id)):db.invoices.find(f=>f.id===id);if(!d)return;
  if(kind==='quote'&&!d.number){d.number=nextNumber('PRE',db.quotes,d.date);if(S.ed&&!S.ed.isNew)edCommit()}
  const c=client(d.client);S.send={kind,id,to:c?{name:c.name,phone:c.phone,email:c.email}:null,picking:!c,q:''};renderSend()}
function renderSend(){const x=S.send,d=sendDoc();if(!d)return;const to=x.to;
  const list=people(x.q).slice(0,60);
  const msg=docMessage(d,x.kind,to?.name);const wa=to&&to.phone?`https://wa.me/${waNum(to.phone)}?text=${encodeURIComponent(msg)}`:'';
  dlg(`<div class="dlg-head"><h2>Enviar ${x.kind==='quote'?'presupuesto':'factura'} ${esc(d.number)}</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="dlg-body">
   ${to&&!x.picking?`<div class="chosen"><span class="avatar">${esc(initials(to.name))}</span><div style="min-width:0;flex:1"><b>${esc(to.name)}</b><span>${esc([prettyPhone(to.phone),to.email].filter(Boolean).join(' · ')||'Sin teléfono ni correo')}</span></div><button class="btn sm" data-act="sendPick">Cambiar</button></div>
   <div class="stack" style="gap:8px">
     <button class="btn wa" data-act="sendShare" style="min-height:52px">${ic('chat')} Enviar PDF por WhatsApp</button>
     <p class="hint" style="margin:-2px 0 4px">Se abre WhatsApp con el PDF adjunto: toca a <b>${esc(to.name)}</b> en la lista y envía. El mensaje va ya escrito.</p>
     <button class="btn" data-act="sendShare">${ic('file')} Enviar PDF por correo u otra app</button>
     ${wa?`<a class="btn ghost" href="${wa}" target="_blank" rel="noopener">${ic('chat')} Abrir el chat de ${esc(to.name.split(' ')[0])} (solo mensaje)</a>`:''}
     ${canSave()?`<button class="btn ghost" data-act="sendDownload">${ic('file')} Descargar el PDF</button>`:''}
   </div>`:
   `<div class="row"><div class="search" style="flex:1;min-width:180px">${ic('search')}<input class="input" id="send-q" data-in="sendQ" placeholder="Buscar cliente o contacto" value="${esc(x.q)}"></div><button class="btn" data-act="importAgenda">${ic('users')} Agenda del móvil</button></div>
    <div class="list" id="send-list" style="max-height:46vh;overflow:auto">${list.map(p=>`<button class="li" style="grid-template-columns:auto minmax(0,1fr) auto" data-act="sendTo" data-k="${esc(p.key)}"><span class="avatar" style="width:30px;height:30px;font-size:12px">${esc(initials(p.name))}</span><div style="min-width:0"><div class="t">${esc(p.name)}</div><div class="s">${esc(prettyPhone(p.phone)||p.email||'Sin teléfono')}</div></div><span class="pill ${p.tag==='Cliente'?'st-Aceptado':'st-Borrador'}">${p.tag}</span></button>`).join('')||'<div class="empty"><b>Nadie con ese nombre</b>Trae tus contactos con «Agenda del móvil».</div>'}</div>`}
  </div>`)}
function markDocSent(){const x=S.send,d=sendDoc();if(!d)return;
  if(x.kind==='quote'){if(d.status==='Borrador'){d.status='Enviado';d.sentAt=today()}if(S.ed&&S.ed.q===d){if(!S.ed.isNew)edCommit()}else save()}
  else{d.sentAt=today();save()}}

/* ---------- Enviar al gestor ---------- */
function gestorDialog(month){const months=[...new Set(db.invoices.map(f=>f.date.slice(0,7)))].sort().reverse();month=month||months[0]||today().slice(0,7);
  const fs=db.invoices.filter(f=>f.date.startsWith(month)).sort((a,b)=>a.number.localeCompare(b.number));const tot=fs.reduce((a,f)=>{const t=calc(f);a.n+=t.net;a.i+=t.iva;a.t+=t.total;return a},{n:0,i:0,t:0});const [y,m]=month.split('-');const co=db.company;
  S.gestor={month,ids:fs.map(f=>f.id)};
  dlg(`<div class="dlg-head"><h2>Enviar al gestor</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div>
  <div class="dlg-body"><label class="field">Mes<select id="g-month" data-in="gMonth">${months.map(x=>{const [yy,mm]=x.split('-');return `<option value="${x}" ${x===month?'selected':''}>${MONTHS[+mm-1]} ${yy}</option>`}).join('')}</select></label>
   <div class="panel" style="padding:14px"><b>${fs.length} factura${fs.length===1?'':'s'} de ${MONTHS[+m-1]} ${y}</b><div class="small muted">${fs.map(f=>esc(f.number)).join(' · ')||'Ninguna'}</div><div class="row small" style="margin-top:8px;gap:16px"><span>Base <b class="num">${eur(tot.n)}</b></span><span>IVA <b class="num">${eur(tot.i)}</b></span><span>Total <b class="num">${eur(tot.t)}</b></span></div></div>
   <p class="muted small" style="margin:0">Para: <b style="color:var(--ink)">${esc(co.gestorName||'tu gestoría')}</b> ${esc(co.gestorEmail||'')} · Cámbialo en Ajustes.</p>
   <p class="hint" style="margin:0">Se genera un único PDF con todas las facturas del mes, listo para mandar por correo o WhatsApp.</p></div>
  <div class="dlg-foot">${canSave()?`<button class="btn" data-act="gestorDownload" ${fs.length?'':'disabled'}>${ic('file')} Descargar</button>`:''}${co.gestorEmail?`<a class="btn" href="mailto:${esc(co.gestorEmail)}?subject=${encodeURIComponent('Facturas '+MONTHS[+m-1]+' '+y+' · Construcciones SGM')}&body=${encodeURIComponent('Hola, te adjunto las facturas de '+MONTHS[+m-1]+' '+y+'. Un saludo, Sergio')}">Correo al gestor</a>`:''}<button class="btn primary" data-act="gestorShare" ${fs.length?'':'disabled'}>${ic('chat')} Enviar PDF</button></div>`)}
async function gestorPDF(){const g=S.gestor;if(!g||!g.ids.length)return null;const [y,m]=g.month.split('-');return buildPDF(g.ids.map(id=>({d:db.invoices.find(f=>f.id===id),kind:'invoice'})),`Facturas ${MONTHS[+m-1]} ${y} - Construcciones SGM.pdf`)}

 delClient:el=>{const id=el.dataset.id;const n=db.quotes.filter(q=>q.client===id).length;if(n){dlg(`<div class="dlg-head"><h2>No se puede eliminar</h2></div><div class="dlg-body"><p style="margin:0">Este cliente tiene ${n} presupuesto${n>1?'s':''}. Elimínalos antes o deja el cliente como está.</p></div><div class="dlg-foot"><button class="btn primary" data-act="closeDlg">Entendido</button></div>`);return}confirmBox('¿Eliminar cliente?','Se borrará su ficha.','Eliminar',()=>{db.clients=db.clients.filter(c=>c.id!==id);save();render();toast('Cliente eliminado')})},
 quoteFor:el=>{closeDlg();newQuote();S.ed.q.client=el.dataset.id;render()},
 editWork:el=>editWork(el.dataset.id),
 saveWork:el=>{const n=$('#ew-name').value.trim();if(!n){$('#ew-err').innerHTML='<div class="err">Escribe el nombre de la obra.</div>';return}const id=el.dataset.id;const w=id?work(id):{id:uid(),start:today()};Object.assign(w,{name:n,client:$('#ew-client').value,status:$('#ew-status').value,address:$('#ew-address').value.trim(),notes:$('#ew-notes').value});if(!id)db.works.push(w);save();closeDlg();render();toast('Obra guardada')},
 delWork:el=>confirmBox('¿Eliminar obra?','Los presupuestos y gastos se conservan, pero quedan sin obra asociada.','Eliminar',()=>{const id=el.dataset.id;db.works=db.works.filter(w=>w.id!==id);db.quotes.forEach(q=>{if(q.work===id)q.work=''});db.expenses.forEach(e=>{if(e.work===id)e.work=''});save();render();toast('Obra eliminada')}),
 addExpense:()=>{const amount=parseNum($('#e-amount').value),concept=$('#e-concept').value.trim();if(!amount||!concept){$('#e-err').innerHTML='<div class="err">Pon el importe y el concepto.</div>';return}db.expenses.push({id:uid(),date:$('#e-date').value||today(),concept,supplier:$('#e-supplier').value.trim(),cat:$('#e-cat').value,amount:r2(amount),work:$('#e-work').value,thumb:S.thumb||''});S.thumb='';save();render();toast('Gasto apuntado')},
 delExpense:el=>confirmBox('¿Borrar este gasto?','Se quitará de la obra y del resumen del mes.','Borrar',()=>{db.expenses=db.expenses.filter(e=>e.id!==el.dataset.id);save();render()}),
 pasteExcel:()=>dlg(`<div class="dlg-head"><h2>Pegar precios desde Excel</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div><div class="dlg-body"><p class="muted" style="margin:0">En tu Excel, selecciona las columnas <b>Partida</b>, <b>Unidad</b> y <b>Precio</b>, cópialas y pégalas aquí. Las partidas que ya existen se actualizan; las nuevas se añaden como partidas propias.</p><label class="field">Datos copiados<textarea id="xl-text" placeholder="Alicatado de paredes&#9;m²&#9;42&#10;Pintura de paredes&#9;m²&#9;9,50"></textarea></label><label class="field">Capítulo para las partidas nuevas<select id="xl-cap">${CAPS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><div id="xl-err"></div></div><div class="dlg-foot"><button class="btn" data-act="closeDlg">Cancelar</button><button class="btn primary" data-act="importExcel">${ic('check')} Importar</button></div>`),
 importExcel:()=>{const rows=$('#xl-text').value.split(/\n/).map(r=>r.split(/\t|;/).map(x=>x.trim())).filter(r=>r[0]);let up=0,add=0;const cap=$('#xl-cap').value;for(const r of rows){const name=r[0];const unit=UNITS.includes(r[1])?r[1]:(r[1]||'').replace('m2','m²')||'ud';const price=parseNum(r[r.length-1]);if(!price)continue;if(itemInfo(name)){db.prices[name]=r2(price);up++}else{db.custom.push({cap,name,unit:UNITS.includes(unit)?unit:'ud',price:r2(price)});add++}}if(!up&&!add){$('#xl-err').innerHTML='<div class="err">No he encontrado filas con precio. Revisa que cada fila tenga partida, unidad y precio.</div>';return}save();closeDlg();render();toast(`${up} precios actualizados · ${add} partidas nuevas`)},
 customItem:()=>dlg(`<div class="dlg-head"><h2>Partida propia</h2><span class="spacer"></span><button class="icon-btn" data-act="closeDlg" aria-label="Cerrar">${ic('x')}</button></div><div class="dlg-body"><label class="field">Nombre de la partida *<input id="ci-name" placeholder="Ej.: Colocación de plato de ducha extraplano"></label><div class="grid3"><label class="field">Capítulo<select id="ci-cap">${CAPS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select></label><label class="field">Unidad<select id="ci-unit">${UNITS.map(u=>`<option>${u}</option>`).join('')}</select></label><label class="field">Precio €<input id="ci-price" inputmode="decimal"></label></div><div id="ci-err"></div></div><div class="dlg-foot"><button class="btn" data-act="closeDlg">Cancelar</button><button class="btn primary" data-act="saveCustom">${ic('check')} Guardar</button></div>`),
 saveCustom:()=>{const name=$('#ci-name').value.trim();if(!name||itemInfo(name)){$('#ci-err').innerHTML=`<div class="err">${name?'Ya existe una partida con ese nombre.':'Escribe el nombre de la partida.'}</div>`;return}db.custom.push({cap:$('#ci-cap').value,name,unit:$('#ci-unit').value,price:r2(parseNum($('#ci-price').value))});save();closeDlg();render();toast('Partida añadida a tu tarifa')},
 backup:()=>copyText(JSON.stringify(db),'Datos copiados. Pégalos en un documento para guardarlos.'),
 sampleDemo:()=>confirmBox('¿Cargar datos de ejemplo?','Se sustituirán los datos de esta demo por presupuestos, clientes y facturas de ejemplo.','Cargar ejemplos',()=>{db=seed(true);save();go('inicio');toast('Datos de ejemplo cargados')},false),
 resetDemo:()=>confirmBox('¿Empezar de cero?','Se borrarán todos los datos de esta demo.','Empezar de cero',()=>{db=seed();save();go('inicio');toast('Demo vacía')}),
};
function copyText(t,msg){const ok=()=>toast(msg);try{navigator.clipboard.writeText(t).then(ok,()=>fallbackCopy(t,ok))}catch(e){fallbackCopy(t,ok)}}
function fallbackCopy(t,ok){const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}

const IN={
 qSearch:el=>{S.qSearch=el.value;const pos=el.selectionStart;render();const n=$('#q-search');n.focus();n.setSelectionRange(pos,pos)},
 cSearch:el=>{S.cSearch=el.value;const pos=el.selectionStart;render();const n=$('#c-search');n.focus();n.setSelectionRange(pos,pos)},
 pSearch:el=>{S.pSearch=el.value;const pos=el.selectionStart;render();const n=$('#p-search');n.focus();n.setSelectionRange(pos,pos)},
 cq:el=>{S.ed.cq=el.value;const s=el.value.toLowerCase();const cl=db.clients.filter(x=>!s||(x.name+' '+x.phone+' '+x.address).toLowerCase().includes(s)).slice(0,8);$('#cl-list').innerHTML=cl.map(x=>`<button class="cp" data-act="pickClient" data-id="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.phone||x.address||'')}</span></button>`).join('')||'<p class="muted">No hay coincidencias. Crea el cliente nuevo.</p>'},
 catSearch:el=>{S.ed.search=el.value;$$('#cap-chips .chip').forEach(b=>b.setAttribute('aria-pressed',!el.value&&b.dataset.c===S.ed.cap));edPicker()},
 dict:el=>{S.ed.dict=el.value},
 aiDraft:el=>{S.ed.aiDraft=el.value},
 sendQ:el=>{S.send.q=el.value;const l=$('#send-list');if(!l)return;const tmp=document.createElement('div');S.send.picking=true;const html=people(el.value).slice(0,60);renderSendList(l,html)},
 vcf:el=>{const f=el.files[0];if(!f)return;f.text().then(t=>{const list=parseVCF(t);if(!list.length){toast('Ese archivo no tiene contactos');return}const n=mergeContacts(list);toast(n+' contactos nuevos de '+list.length);el.value='';afterAgenda()})},
 gMonth:el=>gestorDialog(el.value),
 restore:el=>{const f=el.files[0];if(!f)return;f.text().then(t=>{let x;try{x=JSON.parse(t)}catch(e){}el.value='';if(!x||x.v!==2||!Array.isArray(x.quotes)){toast('Ese archivo no es una copia de SGM');return}confirmBox('¿Restaurar esta copia?','Se sustituirán los datos actuales por los de la copia.','Restaurar',()=>{x.contacts??=[];db=x;save();go('inicio');toast('Copia restaurada')},false)})},
 found:el=>{S.ed.found[+el.dataset.i].on=el.checked;const b=$('[data-act="addFound"]');if(b)b.lastChild.textContent=' Añadir '+S.ed.found.filter(f=>f.on).length+' partidas'},
 qf:el=>{const q=S.ed.q,k=el.dataset.k;q[k]=['iva','discount','validity'].includes(k)?Math.max(0,parseNum(el.value)):el.value;if(k==='discount')q.discount=Math.min(100,q.discount);edRefreshTotals();if(S.ed.step===3){const p=$('#preview');if(p){p.innerHTML=docHTML(q,'quote');fitPapers()}}const h=$('.head h1');if(k==='title'&&h)h.textContent=q.title||'Presupuesto sin título';if(!S.ed.isNew)edCommit();if(k==='payMethod')render()},
 line:el=>{const l=S.ed.q.lines.find(l=>l.id===el.dataset.id),k=el.dataset.k;if(k==='qty'||k==='price')l[k]=Math.max(0,parseNum(el.value));else l[k]=el.value;$('#la-'+l.id).textContent=eur(l.qty*l.price);edRefreshTotals()},
 price:el=>{const p=parseNum(el.value);db.prices[el.dataset.name]=r2(p);save()},
 co:el=>{const k=el.dataset.k;db.company[k]=['iva','validity','dueDays'].includes(k)?parseNum(el.value):el.value;save()},
 ticket:el=>{const f=el.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,160/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);S.thumb=c.toDataURL('image/jpeg',.7);const t=$('#e-thumb');t.src=S.thumb;t.hidden=false;URL.revokeObjectURL(url)};img.src=url}
};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;const f=IN[el.dataset.in];if(f&&el.type!=='file'&&el.type!=='checkbox')f(el)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-in]');if(!el)return;const f=IN[el.dataset.in];if(f&&(el.tagName==='SELECT'||el.type==='file'||el.type==='checkbox'))f(el)});
document.addEventListener('submit',e=>{if(e.target.id==='ai-start'){e.preventDefault();const t=$('#ai-start-text').value.trim();newQuote();S.ed.step=2;S.ed.mode='ai';S.ed.sheet=true;render();window.scrollTo(0,0);if(t)aiSend(t)}});
document.addEventListener('focusout',e=>{const el=e.target;if(el.matches&&el.matches('[data-in="line"][data-k="qty"],[data-in="line"][data-k="price"]')){const l=S.ed?.q.lines.find(l=>l.id===el.dataset.id);if(l)el.value=el.dataset.k==='qty'?qtyFmt(l.qty):String(l.price).replace('.',',')}});
document.addEventListener('keydown',e=>{if(e.target&&e.target.id==='ai-text'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ACT.aiSend();return}
if(e.key==='Escape'&&S.ed?.sheet){S.ed.sheet=false;render()}});

if(!DEMO){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__installEvt=e});window.addEventListener('appinstalled',()=>{window.__installEvt=null;toast('SGM instalada');if(AUTH)render()});if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})}
db=load();
/* Enlace personal de configuración: #datos=<base64url JSON>. Se aplica solo en este dispositivo y se borra de la dirección. */
(function(){const m=(location.hash||'').match(/^#datos=([A-Za-z0-9_-]+)$/);if(!m)return;
  try{const b=m[1].replace(/-/g,'+').replace(/_/g,'/');const bin=atob(b+'==='.slice((b.length+3)%4));const x=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
    const keys=['name','legal','nif','address','city','email','phone','iban','gestorName','gestorEmail'];let n=0;for(const k of keys)if(typeof x[k]==='string'&&x[k].trim()){db.company[k]=x[k].trim();n++}
    if(n){save();setTimeout(()=>toast('Datos de la empresa guardados'),600)}}catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}})();
const h=(location.hash||'').slice(1);if(VIEWS[h])S.view=h;
render();
</script>
